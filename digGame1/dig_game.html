<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⛏️ Dig Game</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', 'Consolas', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh; /* iOS: dynaaminen viewport-korkeus */
    overflow-x: hidden;
    overflow-y: hidden;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
}

#game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 10px;
    max-width: 900px;
    width: 100%;
}

#game-header {
    text-align: center;
    width: 100%;
}

#game-header h1 {
    font-size: 2rem;
    color: #ffd700;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    margin-bottom: 5px;
    letter-spacing: 2px;
}

#game-header h1 .version-tag {
    font-size: 0.5rem;
    font-weight: normal;
    color: #9a9a9a;
    vertical-align: super;
    letter-spacing: 1px;
}

#game-info {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    font-size: 1rem;
    background: #16213e;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #0f3460;
}

#canvas-wrapper {
    border: 3px solid #0f3460;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(100, 100, 255, 0.3);
    line-height: 0;
    max-width: 100%;
}

canvas {
    display: block;
    max-width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

#controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

#keyboard-hints {
    display: flex;
    gap: 15px;
    font-size: 0.8rem;
    color: #888;
    flex-wrap: wrap;
    justify-content: center;
}

#touch-controls {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.touch-pad-row {
    display: flex;
    align-items: center;
    gap: 20px;
}

.touch-row {
    display: flex;
    gap: 6px;
}

.touch-dpad {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.touch-btn {
    width: 60px;
    height: 60px;
    font-size: 1.7rem;
    background: #16213e;
    border: 2px solid #0f3460;
    color: #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

.touch-btn:active {
    background: #0f3460;
    transform: scale(0.9);
    border-color: #ffd700;
}

.space-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 1.5rem;
    flex-shrink: 0;
}

.space-btn.active {
    background: #0f3460;
    border-color: #ffd700;
    transform: scale(0.9);
}

#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

#overlay.hidden {
    display: none !important;
}

#overlay-content {
    background: #16213e;
    border: 2px solid #ffd700;
    border-radius: 12px;
    padding: 30px 40px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    animation: popIn 0.3s ease-out;
}

@keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

#overlay-title {
    font-size: 2rem;
    color: #ffd700;
    margin-bottom: 15px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

#overlay-message {
    font-size: 1.1rem;
    color: #ccc;
    margin-bottom: 20px;
    line-height: 1.5;
    white-space: pre-wrap;
}

#overlay-button {
    background: #ffd700;
    color: #1a1a2e;
    border: none;
    padding: 12px 40px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
    -webkit-tap-highlight-color: transparent;
}

#overlay-button:hover {
    background: #ffed4a;
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
}

@media (max-width: 768px) {
    /* Poistettu body flex-start ja containerin padding-top, 
       jotta peli asettuu nätisti ruudun keskelle kuten PC:lläkin */
    #game-container {
        padding: 10px 5px;
    }
    #controls {
        /* Poistettu fixed-positio, jotta näppäimet asettuvat 
           suoraan pelialueen alapuolelle */
        margin-top: 10px;
    }
    #touch-controls {
        display: flex;
    }
    #keyboard-hints {
        display: none;
    }
    #game-header h1 {
        font-size: 1.4rem;
    }
    #game-info {
        font-size: 0.8rem;
        gap: 10px;
    }
}

@media (min-width: 769px) {
    #touch-controls {
        display: none !important;
    }
}

</style>
</head>
<body>
    <div id="game-container">
        <header id="game-header">
            <h1>⛏️ Dig Game <span class="version-tag">v1.0</span></h1>
            <div id="game-info">
                <span id="progress-display">Matka: 0%</span>
                <span id="diamond-display">💎 0</span>
                <span id="score-display">Pisteet: 0</span>
                <span id="lives-display">❤️ 3</span>
            </div>
        </header>
        <div id="canvas-wrapper">
            <canvas id="game-canvas"></canvas>
        </div>
        <div id="controls">
            <div id="keyboard-hints">
                <span>⬆️⬇️⬅️➡️ / WASD = Liiku</span>
                <span>Välilyönti + suunta = Kaiva / tartu</span>
                <span>Enter = Jatka</span>
                <span>P = Tauko</span>
                <span>R = Aloita alusta</span>
            </div>
            <div id="touch-controls">
                <div class="touch-pad-row">
                    <button class="touch-btn space-btn" id="space-btn" title="Kaiva / tartu (Space)">⛏️</button>
                    <div class="touch-dpad">
                        <div class="touch-row">
                            <button class="touch-btn" data-dir="up">⬆️</button>
                        </div>
                        <div class="touch-row">
                            <button class="touch-btn" data-dir="left">⬅️</button>
                            <button class="touch-btn" data-dir="down">⬇️</button>
                            <button class="touch-btn" data-dir="right">➡️</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="overlay" class="hidden">
        <div id="overlay-content">
            <h2 id="overlay-title"></h2>
            <p id="overlay-message"></p>
            <button id="overlay-button">Pelaa</button>
        </div>
    </div>
<script>
// constants.js - Pelin vakiot ja ruututyypit
const TILE = Object.freeze({
    EMPTY:    0,   // Kaivettu / tyhjä tila
    DIRT:     1,   // Maa (kaivettava)
    WALL:     2,   // Kallioseinä (tuhoutumaton)
    BOULDER:  3,   // Kivi (putoava)
    DIAMOND:  4,   // Timantti (kerättävä)
    EXIT:     5,   // Portti / maali
    PLAYER:   6,   // Pelaaja
    FIREFLY:  7,   // Tulikärpänen (vihollinen)
    BUTTERFLY:8,   // Perhonen (vihollinen)
    EXPLOSION:9,   // Räjähdys-animaatio
    SKY:     10,   // Taivas (ei voi kiivetä)
    GRASS:   11,   // Maanpinta (käveltävä, ei kaivettava)
    TREE:    12,   // Puu (putoaa, kun alta kaivetaan)
    HOUSE:   13,   // Talo (putoaa, kun alta kaivetaan)
});

const DIR = Object.freeze({
    UP:    { dx: 0,  dy: -1, name: 'up' },
    DOWN:  { dx: 0,  dy: 1,  name: 'down' },
    LEFT:  { dx: -1, dy: 0,  name: 'left' },
    RIGHT: { dx: 1,  dy: 0,  name: 'right' },
});

const CELL_SIZE = 32;
const FRAME_DELAY = 160; // ms per frame (pelin rytmi / painovoima)
const ENEMY_DELAY = 320; // ms vihollisen askeleiden välillä

// Maailman rakenne: yksi yhtenäinen maailma, ei erillisiä tasoja.
// Rakenne pystysuunnassa: ylhäällä taivas, sen alla maanpinta (nurmi),
// jota alaspäin maan alainen kaivettava maa ja pohjalla kallioperä.
const WORLD_ROWS  = 21;                 // rivejä yhteensä
const SKY_ROW     = 0;                  // taivas (ei voi kiivetä)
const SURFACE_ROW = 1;                  // maanpinta (käveltävä, ei kaivettava)
const BEDROCK_ROW = WORLD_ROWS - 1;     // kallioperä pohjalla
const SEGMENT_W   = 18;                 // yhden alkuperäisen tason sisäleveys
const START_PAD   = 2;                  // alkupiha (pelaajan aloitus)
const END_PAD     = 3;                  // loppupiha (maalin edusta)

// Näkymä: kamera seuraa pelaajaa vaakasuunnassa, koko korkeus näkyy.
const VIEW_COLS = 23;
const VIEW_ROWS = WORLD_ROWS;

// Pyöristetyn kaivureunan säde (px): tekee kaivamisesta "pyöreää"
// niin että raja ei ole enää suora [] vaan kaareva.
const CORNER_RADIUS = 9;

const COLORS = {
    [TILE.EMPTY]:     '#0a0a1a',
    [TILE.DIRT]:      '#6B3410',
    [TILE.WALL]:      '#555555',
    [TILE.BOULDER]:   '#888888',
    [TILE.DIAMOND]:   '#00FFFF',
    [TILE.EXIT]:      '#FFD700',
    [TILE.PLAYER]:    '#FFD700',
    [TILE.FIREFLY]:   '#FF4444',
    [TILE.BUTTERFLY]: '#FF8800',
    [TILE.EXPLOSION]: '#FFFF00',
    [TILE.SKY]:       '#7ec8e3',
    [TILE.GRASS]:     '#4a8f29',
    [TILE.TREE]:      '#2e7d32',
    [TILE.HOUSE]:     '#c96b4a',
};

const GRAVITY_DELAY = 1;  // Kehystä putoamiselle (0 = välitön)
const INITIAL_LIVES = 3;
const SCORE_DIAMOND = 10;
const SCORE_ENEMY = 25;
const SCORE_DROP = 5;       // Puun/talon pudotus monttuun
const SCORE_WORLD_BONUS = 500;


// levels.js - Yhtenäisen maailman rakentaja.
// Alkuperäiset 4 tasoa yhdistetään peräkkäin yhdeksi pitkäksi maailmaksi,
// jota kuljetaan vasemmalta oikealle. Maailman yläosa on maanpinta
// (puita ja taloja), alaosa maan alainen kaivettava maa.
//
// Segmenttien legenda: # = seinä, . = maa, ' ' = tyhjä, o = kivi,
//                      * = timantti, P = pelaaja, X = uloskäynti,
//                      F = tulikärpänen, B = perhonen

const SEGMENTS = [];

// === Osa 1: Aloittelijan luola ===
SEGMENTS.push([
    '####################',
    '#....o.............#',
    '#.###....###..###..#',
    '#.#  #..*#  ## o#..#',
    '#.# o.....#...# P..#',
    '#.#######...##.##..#',
    '#......o..*...o...#',
    '#.######.####.###..#',
    '#.#    .*.. .*   .##',
    '#.# o..####.##...o.#',
    '#.##..........###..#',
    '#....**...........X#',
    '#.#######.#######.##',
    '#....o.*.....#o....#',
    '####################',
]);

// === Osa 2: Kivivyöry ===
SEGMENTS.push([
    '####################',
    '#P  o   o   o     #',
    '####.####.####.#### #',
    '#  *   *   *   *  #',
    '# ####.####.####.###',
    '# o   o   o   o   #',
    '#.####.####.####.###',
    '#   *   *   *   * #',
    '###.####.####.#### #',
    '#  o   o   o   o  #',
    '#.####.####.####.###',
    '#*   *  B*   *   *#',
    '# ####.####.####.##',
    '#   o   o   o    X#',
    '####################',
]);

// === Osa 3: Tulikärpästen pesä ===
SEGMENTS.push([
    '####################',
    '#P ..........o.....#',
    '##.#####.######.##.#',
    '#..*...#......#..#.#',
    '#.##.#.#.####.#..#.#',
    '#.#  #.#.#  #.#..#.#',
    '#.# .*..#.#  #.*#..#',
    '#.# ####.#.##.#..#.#',
    '#.#       .*  .*..#',
    '#.# ######.##.##..##',
    '#.#     F#..........',
    '#.# #####.#####.###.',
    '#.*.....o............',
    '#.#####.#####.#####X#',
    '####################',
]);

// === Osa 4: Timanttikaivos ===
SEGMENTS.push([
    '####################',
    '#P  o   *  B o    #',
    '##.##.##.##.##.##.##',
    '#*   o   *   o   *#',
    '#.##.##.##.##.##.##',
    '#  o   *   o   *  #',
    '##.##.##.##.##.##.##',
    '#*   o   F   o   *#',
    '#.##.##.##.##.##.##',
    '#  o   *   o   *  #',
    '##.##.##.##.##.##.##',
    '#*   o   *   o   *#',
    '#.##.##.##.##.##.##',
    '#  *   o   *   o X#',
    '####################',
]);

// Merkki -> ruututyyppi (reunukset on jo poistettu)
function charToTile(ch) {
    switch (ch) {
        case '#': return TILE.WALL;
        case '.': return TILE.DIRT;
        case 'o': return TILE.BOULDER;
        case '*': return TILE.DIAMOND;
        case 'F': return TILE.FIREFLY;
        case 'B': return TILE.BUTTERFLY;
        case 'P': return TILE.EMPTY;   // vanha aloituspiste -> ilmatasku
        case 'X': return TILE.DIRT;    // vanha uloskäynti -> maata
        default:  return TILE.EMPTY;   // ' ' -> tyhjä luolatila
    }
}

// Rakentaa yhtenäisen maailman: palauttaa gridin ja metatiedot.
function buildWorld() {
    const segCount = SEGMENTS.length;
    const width  = START_PAD + segCount * SEGMENT_W + END_PAD;
    const height = WORLD_ROWS;

    // Täytetään ensin kaikki maalla
    const grid = [];
    for (let y = 0; y < height; y++) {
        grid[y] = [];
        for (let x = 0; x < width; x++) grid[y][x] = TILE.DIRT;
    }

    // Taivas, maanpinta ja kallioperä
    for (let x = 0; x < width; x++) {
        grid[SKY_ROW][x] = TILE.SKY;
        grid[SURFACE_ROW][x] = TILE.GRASS;
        grid[BEDROCK_ROW][x] = TILE.WALL;
    }

    // Kopioi alkuperäiset segmentit maan alle (peräkkäin)
    const segTop  = SURFACE_ROW + 1; // rivi 2
    const segRows = 13;              // sisältö ilman ylä- ja alariviä
    for (let s = 0; s < segCount; s++) {
        const map = SEGMENTS[s];
        const offX = START_PAD + s * SEGMENT_W;
        for (let y = 0; y < segRows; y++) {
            const srcRow = map[y + 1] || '';
            for (let x = 0; x < SEGMENT_W; x++) {
                grid[segTop + y][offX + x] = charToTile(srcRow[x + 1]);
            }
        }
    }

    // Syvempi kerros (segmenttien alle): ripottele kiviä ja timantteja
    for (let x = 2; x < width - 2; x++) {
        for (let y = segTop + segRows; y < BEDROCK_ROW; y++) {
            const r = (x * 7 + y * 13) % 17;
            if (r === 0) grid[y][x] = TILE.BOULDER;
            else if (r === 1) grid[y][x] = TILE.DIAMOND;
        }
    }

    // === Pulma (entinen "taso 3"): tiputa puu ja talo monttuun ===
    // Pinnalla on puu ja talo, joiden ohi ei pääse. Niiden alta pitää
    // kaivaa maa pois, jolloin ne putoavat monttuun ja pinta aukeaa.
    // Maan alta pulman ohi ei pääse (kallioseinä), joten on noustava pinnalle.
    const pzX    = START_PAD + 2 * SEGMENT_W;   // pulma-alueen alku (osa 3)
    const treeX  = pzX + 4;
    const houseX = pzX + 6;

    // Tyhjennä pulma-alueen maanalainen osa puhtaaksi maaksi
    for (let y = segTop; y < BEDROCK_ROW; y++) {
        for (let x = pzX; x <= pzX + 7; x++) {
            grid[y][x] = TILE.DIRT;
        }
    }

    // Puu ja talo pinnalle
    grid[SURFACE_ROW][treeX]  = TILE.TREE;
    grid[SURFACE_ROW][houseX] = TILE.HOUSE;

    // Tuki puun ja talon alla (rivi 2). Väliin jää aukko,
    // josta tukea voi kaivaa sivusta käsin (turvallisesti).
    grid[segTop][treeX]  = TILE.DIRT;
    grid[segTop][houseX] = TILE.DIRT;
    grid[segTop][treeX + 1] = TILE.EMPTY;

    // Monttu (kuoppa) puun ja talon alle
    for (let y = segTop + 1; y < BEDROCK_ROW; y++) {
        for (let x = treeX; x <= houseX; x++) {
            grid[y][x] = TILE.EMPTY;
        }
    }

    // Kallioseinä maan alla pulman oikealla puolella:
    // maan alta ei pääse ohi, vaan on noustava pinnalle ja pudotettava
    // puu + talo, jotta pinnalla pääsee jatkamaan vasemmalta oikealle.
    const wallX = pzX + 7;
    for (let y = segTop; y < BEDROCK_ROW; y++) {
        grid[y][wallX] = TILE.WALL;
    }

    // === Koristepuita ja -taloja pinnalle ===
    // Nämäkin putoavat, jos niiden alta kaivaa maan pois.
    const deco = [
        START_PAD + 4,                        // osa 1: puu
        START_PAD + 12,                       // osa 1: talo
        START_PAD + SEGMENT_W + 6,            // osa 2: puu
        START_PAD + SEGMENT_W + 13,           // osa 2: talo
        START_PAD + 3 * SEGMENT_W + 4,        // osa 4: puu
        START_PAD + 3 * SEGMENT_W + 11,       // osa 4: talo
    ];
    deco.forEach((x, i) => {
        if (grid[SURFACE_ROW][x] === TILE.GRASS) {
            grid[SURFACE_ROW][x] = (i % 2 === 0) ? TILE.TREE : TILE.HOUSE;
            // Varmista, että alla on multaa (tuki), jottei puu/talo putoa heti
            grid[segTop][x] = TILE.DIRT;
        }
    });

    // Reunat: pystykallioseinät maailman vasemmalle ja oikealle laidalle
    for (let y = 0; y < height; y++) {
        grid[y][0] = TILE.WALL;
        grid[y][width - 1] = TILE.WALL;
    }

    // Pelaajan aloituspaikka ja maali (portti itäpäässä)
    const playerStartX = 1;
    const playerStartY = SURFACE_ROW;
    grid[playerStartY][playerStartX] = TILE.GRASS;

    const exitX = width - 2;
    grid[SURFACE_ROW][exitX] = TILE.EXIT;

    return {
        grid: grid,
        width: width,
        height: height,
        playerStartX: playerStartX,
        playerStartY: playerStartY,
        name: 'Dig Game',
    };
}


// physics.js - Fysiikkamoottori (kivet, timantit, puut, talot, painovoima)

class Physics {
    constructor(game) {
        this.game = game;
        // Aktiivisesti putoavat (vauhti jo saavutettu)
        this.falling = new Set();
        // "Keikahdus": 1 kehyksen viive ennen putoamista
        this.teetering = new Set();
    }

    reset() {
        this.falling.clear();
        this.teetering.clear();
    }

    key(x, y) { return x + ',' + y; }

    // Onko ruutu läpäistävissä pelaajalle
    isPassable(x, y) {
        if (x < 0 || x >= this.game.cols || y < 0 || y >= this.game.rows) return false;
        const tile = this.game.grid[y][x];
        return tile === TILE.EMPTY || tile === TILE.DIRT ||
               tile === TILE.DIAMOND || tile === TILE.EXIT || tile === TILE.GRASS;
    }

    // Voiko putoava objekti pudota tähän (tyhjä tila, ei pelaajaa)
    canFallInto(x, y) {
        if (x < 0 || x >= this.game.cols || y < 0 || y >= this.game.rows) return false;
        if (this.game.grid[y][x] !== TILE.EMPTY) return false;
        if (this.game.player.x === x && this.game.player.y === y) return false;
        return true;
    }

    // Onko pelaaja suoraan tämän ruudun alla
    isPlayerBelow(x, y) {
        return this.game.player.x === x && this.game.player.y === y + 1;
    }

    isFallingTile(tile) {
        return tile === TILE.BOULDER || tile === TILE.DIAMOND ||
               tile === TILE.TREE || tile === TILE.HOUSE;
    }

    // Tarkista voiko peliobjekti (kivi, timantti, puu, talo) liikkua alas
    updateFalling(x, y) {
        const tile = this.game.grid[y][x];
        if (!this.isFallingTile(tile)) return false;

        const k = this.key(x, y);

        if (y + 1 >= this.game.rows) {
            this.falling.delete(k);
            this.teetering.delete(k);
            return false;
        }

        const below = this.game.grid[y + 1][x];
        const playerBelow = this.isPlayerBelow(x, y);

        // Putoaminen tyhjään tilaan
        if (below === TILE.EMPTY) {
            // Pelaaja alla TUKEE objektia -> ei putoa (ellei jo vauhdissa)
            if (playerBelow && !this.falling.has(k)) {
                this.teetering.delete(k);
                return false;
            }

            // Keikahdus: 1 kehyksen viive ennen putoamista
            if (!this.falling.has(k) && !this.teetering.has(k)) {
                this.teetering.add(k);
                // Puun/talon pudotus pinnalta antaa pisteet
                if ((tile === TILE.TREE || tile === TILE.HOUSE) && y === SURFACE_ROW) {
                    this.game.awardDrop();
                }
                return false;
            }

            // Nyt pudotaan yksi ruutu
            this.teetering.delete(k);
            this.falling.delete(k);
            // Puu/talo jättää pinnalle nurmikon
            this.game.grid[y][x] =
                (y === SURFACE_ROW && (tile === TILE.TREE || tile === TILE.HOUSE))
                ? TILE.GRASS : TILE.EMPTY;

            if (playerBelow) {
                if (tile === TILE.DIAMOND) {
                    this.game.collectDiamond();
                } else {
                    this.game.killPlayer();
                }
            } else {
                this.game.grid[y + 1][x] = tile;
                this.falling.add(this.key(x, y + 1));
                this.checkEnemyCrush(x, y + 1, tile);
            }
            return true;
        }

        // Alla kova ruutu -> pysähtyy (pieni tömähdys, kun vauhti pysähtyy)
        if (this.falling.has(k) &&
            (tile === TILE.BOULDER || tile === TILE.TREE || tile === TILE.HOUSE)) {
            AudioFX.playThud();
        }
        this.falling.delete(k);
        this.teetering.delete(k);

        // Liukuminen vain kivillä ja timanteilla (puu/talo putoavat suoraan)
        if ((tile === TILE.BOULDER || tile === TILE.DIAMOND) &&
            (below === TILE.BOULDER || below === TILE.DIAMOND)) {
            if (this.canFallInto(x - 1, y) && this.canFallInto(x - 1, y + 1)) {
                this.game.grid[y][x] = TILE.EMPTY;
                this.game.grid[y][x - 1] = tile;
                this.checkEnemyCrush(x - 1, y, tile);
                return true;
            }
            if (this.canFallInto(x + 1, y) && this.canFallInto(x + 1, y + 1)) {
                this.game.grid[y][x] = TILE.EMPTY;
                this.game.grid[y][x + 1] = tile;
                this.checkEnemyCrush(x + 1, y, tile);
                return true;
            }
        }

        // Kivi/puu/talo murskaa alla olevan vihollisen
        if ((tile === TILE.BOULDER || tile === TILE.TREE || tile === TILE.HOUSE) &&
            (below === TILE.FIREFLY || below === TILE.BUTTERFLY)) {
            this.game.grid[y][x] = TILE.EMPTY;
            this.checkEnemyCrush(x, y + 1, tile, below);
            return true;
        }

        return false;
    }

    // Tarkista osuiko putoava objekti viholliseen
    checkEnemyCrush(x, y, tile, targetOverride = null) {
        const target = targetOverride !== null ? targetOverride : this.game.grid[y][x];
        if (tile === TILE.BOULDER || tile === TILE.TREE || tile === TILE.HOUSE) {
            if (target === TILE.FIREFLY) {
                this.game.grid[y][x] = tile;
                this.game.score += SCORE_ENEMY;
                this.game.updateHUD();
                this.game.spawnExplosion(x, y);
                AudioFX.playCrush();
            } else if (target === TILE.BUTTERFLY) {
                // Perhonen räjähtää 3x3 alueelta ja tuhoaa ympäristön
                this.game.grid[y][x] = tile;
                this.game.score += SCORE_ENEMY;
                this.explode(x, y, 1);
                this.game.updateHUD();
                AudioFX.playCrush();
            }
        }
    }

    // Käy läpi koko kenttä ja päivitä fysiikka (alhaalta ylös)
    updateAll() {
        let anyMoved = false;
        for (let y = this.game.rows - 1; y >= 0; y--) {
            for (let x = 0; x < this.game.cols; x++) {
                if (this.updateFalling(x, y)) {
                    anyMoved = true;
                }
            }
        }
        return anyMoved;
    }

    // Räjäytä ympäröivät ruudut (tuhoaa kaiken paitsi seinät ja portin)
    explode(x, y, radius) {
        for (let dy = -radius; dy <= radius; dy++) {
            for (let dx = -radius; dx <= radius; dx++) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < this.game.cols && ny >= 0 && ny < this.game.rows) {
                    const t = this.game.grid[ny][nx];
                    if (t !== TILE.WALL && t !== TILE.EXIT) {
                        this.game.grid[ny][nx] = TILE.EMPTY;
                        this.game.spawnExplosion(nx, ny);
                        if (this.game.player.x === nx && this.game.player.y === ny) {
                            this.game.killPlayer();
                        }
                    }
                }
            }
        }
    }
}


// enemies.js - Vihollisten tekoäly (tulikärpäset ja perhoset)

class EnemyAI {
    constructor(game) {
        this.game = game;
        this.enemyStates = []; // pysyvät tilat: {x, y, type, dirIndex}
    }

    // Kerää kaikki viholliset kentältä (kutsutaan kerran tasoa ladattaessa)
    scanEnemies() {
        this.enemyStates = [];
        for (let y = 0; y < this.game.rows; y++) {
            for (let x = 0; x < this.game.cols; x++) {
                const tile = this.game.grid[y][x];
                if (tile === TILE.FIREFLY || tile === TILE.BUTTERFLY) {
                    this.enemyStates.push({
                        x: x, y: y, type: tile,
                        dirIndex: Math.floor(Math.random() * 4),
                    });
                }
            }
        }
    }

    // Suunnat: tulikärpänen kääntyy vasemmalle (CCW), perhonen oikealle (CW)
    getDirections(type) {
        if (type === TILE.FIREFLY) {
            return [DIR.UP, DIR.RIGHT, DIR.DOWN, DIR.LEFT];
        }
        return [DIR.RIGHT, DIR.DOWN, DIR.LEFT, DIR.UP];
    }

    // Liikuta yhtä vihollista
    moveEnemy(enemy) {
        const dirs = this.getDirections(enemy.type);

        // Tulikärpänen suosii vasemmalle (CCW), perhonen oikealle (CW)
        const first = enemy.type === TILE.FIREFLY
            ? (enemy.dirIndex + 3) % 4  // CCW
            : (enemy.dirIndex + 1) % 4; // CW
        const second = enemy.dirIndex;                    // eteenpäin
        const third = enemy.type === TILE.FIREFLY
            ? (enemy.dirIndex + 1) % 4   // CW
            : (enemy.dirIndex + 3) % 4;  // CCW
        const fourth = (enemy.dirIndex + 2) % 4;          // ympäri

        const order = [first, second, third, fourth];

        for (const idx of order) {
            const d = dirs[idx];
            const nx = enemy.x + d.dx;
            const ny = enemy.y + d.dy;
            if (this.isEnemyPassable(nx, ny)) {
                this.moveEnemyTo(enemy, nx, ny);
                enemy.dirIndex = idx;
                return;
            }
        }
    }

    isEnemyPassable(x, y) {
        if (x < 0 || x >= this.game.cols || y < 0 || y >= this.game.rows) return false;
        // Viholliset liikkuvat vain tyhjässä tilassa (ei mullassa, kivissä, timanteissa)
        return this.game.grid[y][x] === TILE.EMPTY;
    }

    moveEnemyTo(enemy, newX, newY) {
        const oldX = enemy.x;
        const oldY = enemy.y;

        // Törmäys pelaajaan
        if (this.game.player.x === newX && this.game.player.y === newY) {
            this.game.killPlayer();
            return;
        }

        this.game.grid[oldY][oldX] = TILE.EMPTY;
        this.game.grid[newY][newX] = enemy.type;
        enemy.x = newX;
        enemy.y = newY;
    }

    // Tarkista onko vihollinen pelaajan ruudussa
    checkPlayerCollision() {
        for (const enemy of this.enemyStates) {
            if (enemy.x === this.game.player.x && enemy.y === this.game.player.y) {
                this.game.killPlayer();
                return true;
            }
        }
        return false;
    }

    // Päivitä kaikki viholliset
    updateAll() {
        // Poista murskatut viholliset (kivi/timantti korvannut ruudun)
        this.enemyStates = this.enemyStates.filter(e =>
            this.game.grid[e.y][e.x] === e.type
        );
        for (const enemy of this.enemyStates) {
            this.moveEnemy(enemy);
        }
        this.checkPlayerCollision();
    }
}

// renderer.js - Canvas-piirtäjä (kamera, pyöristetyt kaivureunat, hiukkaset)

class Renderer {
    constructor(canvas, game) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.game = game;
        this.animations = [];
        this.particles = [];
        this.flashAlpha = 0;
        
        this.lerpX = 0; 
        this.lerpY = 0;
        this.camLerpX = 0;
    }

    resize() {
        this.canvas.width = VIEW_COLS * CELL_SIZE;
        this.canvas.height = VIEW_ROWS * CELL_SIZE;
    }

    // Kamera seuraa pelaajaa vaakasuunnassa
    getCameraX() {
        const cx = this.game.player.x - Math.floor(VIEW_COLS / 2);
        return Math.max(0, Math.min(cx, this.game.cols - VIEW_COLS));
    }

    addExplosion(x, y) {
        this.animations.push({
            x: x * CELL_SIZE, y: y * CELL_SIZE,
            frame: 0, maxFrames: 6,
        });
    }

    addDeathExplosion(x, y) {
        this.animations.push({
            x: x * CELL_SIZE, y: y * CELL_SIZE,
            frame: 0, maxFrames: 20,
            type: 'death',
        });
        this.flashAlpha = 0.4;
    }

    // Murenemishiukkaset kaivamisen yhteydessä ("syöminen pala palalta")
    addCrumbs(x, y) {
        for (let i = 0; i < 60; i++) {
            const ang = (Math.random() - 0.5) * Math.PI;
            const speed = 1 + Math.random() * 4;
            this.particles.push({
                x: x * CELL_SIZE + CELL_SIZE / 2,
                y: y * CELL_SIZE + CELL_SIZE / 2,
                vx: Math.cos(ang) * speed,
                vy: Math.sin(ang) * speed - 2,
                life: 40 + Math.floor(Math.random() * 30),
                maxLife: 70,
                size: 1 + Math.random() * 2.5,
                color: Math.random() < 0.4 ? '#8a5520' : (Math.random() < 0.5 ? '#6B3410' : '#4a2008'),
            });
        }
    }

    updateAnimations() {
        this.animations = this.animations.filter(a => {
            a.frame++;
            return a.frame < a.maxFrames;
        });

        this.particles = this.particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3;

            const gridX = Math.floor(p.x / CELL_SIZE);
            const gridY = Math.floor(p.y / CELL_SIZE);
            
            if (this.isSolidGround(gridX, gridY)) {
                p.y -= p.vy;
                p.vy *= -0.3;
                p.vx *= 0.5;
            }

            p.life--;
            return p.life > 0;
        });

        if (this.flashAlpha > 0) {
            this.flashAlpha = Math.max(0, this.flashAlpha - 0.015);
        }
    }

    // Onko ruutu "kiinteää maata" (ei kaivettua aukkoa) - käytetään
    // pyöristetyn kaivureunan laskentaan.
    isSolidGround(wx, wy) {
        if (wx < 0 || wx >= this.game.cols || wy < 0 || wy >= this.game.rows) return true;
        const t = this.game.grid[wy][wx];
        return t === TILE.DIRT || t === TILE.WALL || t === TILE.BOULDER ||
               t === TILE.GRASS || t === TILE.TREE || t === TILE.HOUSE || t === TILE.SKY;
    }

    render() {
        const ctx = this.ctx;
        const cs = CELL_SIZE;

        const targetX = this.game.player.x;
        const targetY = this.game.player.y;
        
        if (Math.abs(targetX - this.lerpX) > 3) this.lerpX = targetX;
        else this.lerpX += (targetX - this.lerpX) * 0.3;
        
        if (Math.abs(targetY - this.lerpY) > 3) this.lerpY = targetY;
        else this.lerpY += (targetY - this.lerpY) * 0.3;

        const targetCamX = Math.max(0, Math.min(targetX - Math.floor(VIEW_COLS / 2), this.game.cols - VIEW_COLS));
        if (Math.abs(targetCamX - this.camLerpX) > 10) this.camLerpX = targetCamX;
        else this.camLerpX += (targetCamX - this.camLerpX) * 0.15;

        const offsetX = this.camLerpX * cs;

        ctx.fillStyle = '#7ec8e3';
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        const baseCamX = Math.floor(this.camLerpX);
        for (let y = 0; y < VIEW_ROWS; y++) {
            for (let x = -1; x <= VIEW_COLS + 1; x++) {
                const wx = baseCamX + x;
                const wy = y;
                if (wx < 0 || wx >= this.game.cols || wy < 0 || wy >= this.game.rows) continue;
                
                const drawX = (wx * cs) - offsetX;
                const drawY = wy * cs;
                this.drawTile(ctx, drawX, drawY, this.game.grid[wy][wx], wx, wy);
            }
        }

        if (!this.game.deathEnd) {
            const pDrawX = (this.lerpX * cs) - offsetX;
            const pDrawY = this.lerpY * cs;
            this.drawPlayer(ctx, pDrawX, pDrawY);
        }

        this.renderAnimations(ctx, offsetX);
        this.renderParticles(ctx, offsetX);
        this.drawGrid(ctx, VIEW_COLS, VIEW_ROWS, cs, offsetX);

        if (this.flashAlpha > 0) {
            ctx.fillStyle = `rgba(255, 30, 0, ${this.flashAlpha})`;
            ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        }
    }

    drawTile(ctx, px, py, tile, wx, wy) {
        const cs = CELL_SIZE;
        switch (tile) {
            case TILE.EMPTY: break;
            case TILE.DIRT: this.drawDirt(ctx, px, py, wx, wy); break;
            case TILE.WALL: this.drawWall(ctx, px, py); break;
            case TILE.BOULDER: this.drawBoulder(ctx, px, py); break;
            case TILE.DIAMOND: this.drawDiamond(ctx, px, py); break;
            case TILE.EXIT: this.drawExit(ctx, px, py); break;
            case TILE.FIREFLY: this.drawEnemy(ctx, px, py, cs, '#F22', '#F80', '#FC0'); break;
            case TILE.BUTTERFLY: this.drawEnemy(ctx, px, py, cs, '#F60', '#FA0', '#FD4'); break;
            case TILE.SKY: this.drawSky(ctx, px, py, wx, wy); break;
            case TILE.GRASS: this.drawGrass(ctx, px, py, wx, wy); break;
            case TILE.TREE: this.drawTree(ctx, px, py, wx, wy); break;
            case TILE.HOUSE: this.drawHouse(ctx, px, py, wx, wy); break;
        }
    }

    // Piirrä pyöristetty suorakulmio annetuilla kulmasäteillä [vasYlä, oikYlä, oikAla, vasAla]
    roundedRectPath(ctx, x, y, w, h, radii) {
        const tl = radii[0], tr = radii[1], br = radii[2], bl = radii[3];
        ctx.beginPath();
        ctx.moveTo(x + tl, y);
        ctx.lineTo(x + w - tr, y);
        ctx.arcTo(x + w, y, x + w, y + tr, tr);
        ctx.lineTo(x + w, y + h - br);
        ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
        ctx.lineTo(x + bl, y + h);
        ctx.arcTo(x, y + h, x, y + h - bl, bl);
        ctx.lineTo(x, y + tl);
        ctx.arcTo(x, y, x + tl, y, tl);
        ctx.closePath();
    }

    // Maa, jonka kaivetut reunat pyöristyvät (raja ei ole enää suora []).
    drawDirt(ctx, px, py, wx, wy) {
        const cs = CELL_SIZE;
        const R = CORNER_RADIUS;
        const top = !this.isSolidGround(wx, wy - 1);
        const bottom = !this.isSolidGround(wx, wy + 1);
        const left = !this.isSolidGround(wx - 1, wy);
        const right = !this.isSolidGround(wx + 1, wy);
        const radii = [
            top && left ? R : 0,
            top && right ? R : 0,
            bottom && right ? R : 0,
            bottom && left ? R : 0,
        ];
        const x = px + 1, y = py + 1, w = cs - 2, h = cs - 2;

        this.roundedRectPath(ctx, x, y, w, h, radii);
        ctx.fillStyle = '#6B3410';
        ctx.fill();

        // Rakenne (sorapisteet) leikattuna pyöristettyyn muotoon
        ctx.save();
        this.roundedRectPath(ctx, x, y, w, h, radii);
        ctx.clip();
        ctx.fillStyle = '#7B4420';
        const seed = (wx * 31 + wy * 17) % 100;
        for (let i = 0; i < 5; i++) {
            const di = (seed + i * 7) % (cs - 8);
            const dj = (seed * 3 + i * 13) % (cs - 8);
            ctx.fillRect(px + 4 + di, py + 4 + dj, 2, 2);
        }
        ctx.restore();

        this.roundedRectPath(ctx, x, y, w, h, radii);
        ctx.strokeStyle = '#4a2008';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    drawWall(ctx, px, py) {
        const cs = CELL_SIZE, p = 1;
        ctx.fillStyle = '#555';
        ctx.fillRect(px + p, py + p, cs - p * 2, cs - p * 2);
        ctx.fillStyle = '#666';
        ctx.fillRect(px + p, py + p, cs - p * 2, (cs - p * 2) / 2);
        ctx.fillStyle = '#444';
        ctx.fillRect(px + p, py + p + (cs - p * 2) / 2, cs - p * 2, (cs - p * 2) / 2);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + p, py + p, cs - p * 2, cs - p * 2);
        ctx.beginPath();
        ctx.moveTo(px + p, py + cs / 2);
        ctx.lineTo(px + cs - p, py + cs / 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(px + cs / 2, py + p);
        ctx.lineTo(px + cs / 2, py + cs / 2);
        ctx.stroke();
    }

    drawBoulder(ctx, px, py) {
        const cs = CELL_SIZE;
        ctx.fillStyle = '#777';
        ctx.beginPath();
        ctx.arc(px + cs / 2, py + cs / 2, cs / 2 - 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#999';
        ctx.beginPath();
        ctx.arc(px + cs / 2 - 3, py + cs / 2 - 3, cs / 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px + cs / 2, py + cs / 2, cs / 2 - 3, 0, Math.PI * 2);
        ctx.stroke();
    }

    drawDiamond(ctx, px, py) {
        const cs = CELL_SIZE, p = 1;
        const s = Math.sin(Date.now() / 300 + px + py) * 0.3 + 0.7;
        ctx.fillStyle = `rgba(0, 200, 255, ${s})`;
        ctx.beginPath();
        ctx.moveTo(px + cs / 2, py + p + 2);
        ctx.lineTo(px + cs - p - 2, py + cs / 2);
        ctx.lineTo(px + cs / 2, py + cs - p - 2);
        ctx.lineTo(px + p + 2, py + cs / 2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#0AA';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(px + cs / 2 - 3, py + cs / 2 - 2, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    drawExit(ctx, px, py) {
        // Avain (entinen uloskäynti)
        const cs = CELL_SIZE;
        ctx.fillStyle = '#B8860B';
        ctx.fillRect(px + 4, py + 4, cs - 8, cs - 8);
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 4, py + 4, cs - 8, cs - 8);
        ctx.fillStyle = '#FFD700';
        ctx.font = `${cs * 0.55}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🔑', px + cs / 2, py + cs / 2 + 1);
    }

    drawEnemy(ctx, px, py, cs, c1, c2, c3) {
        const pulse = Math.sin(Date.now() / 150) * 2;
        ctx.fillStyle = c1;
        ctx.beginPath();
        ctx.arc(px + cs / 2, py + cs / 2, cs / 2 - 2 + pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = c2;
        ctx.beginPath();
        ctx.arc(px + cs / 2 + 3, py + cs / 2 - 3, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = c3;
        ctx.beginPath();
        ctx.arc(px + cs / 2 - 3, py + cs / 2 - 3, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    drawSky(ctx, px, py, wx, wy) {
        const cs = CELL_SIZE;
        ctx.fillStyle = '#7ec8e3';
        ctx.fillRect(px, py, cs, cs);
        const seed = (wx * 13 + wy * 7) % 100;
        if (seed < 30) {
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.arc(px + cs * 0.4, py + cs * 0.5, 5, 0, Math.PI * 2);
            ctx.arc(px + cs * 0.6, py + cs * 0.45, 6, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    drawGrass(ctx, px, py, wx, wy) {
        const cs = CELL_SIZE;
        ctx.fillStyle = '#6B3410';
        ctx.fillRect(px, py + cs / 2, cs, cs / 2);
        ctx.fillStyle = '#4a8f29';
        ctx.fillRect(px, py + cs / 2 - 4, cs, 8);
        ctx.fillStyle = '#5faf33';
        const seed = (wx * 17 + wy * 11) % 100;
        for (let i = 0; i < 6; i++) {
            const gx = px + ((seed + i * 13) % cs);
            ctx.fillRect(gx, py + cs / 2 - 5, 2, 4 + (i % 3));
        }
    }

    drawTree(ctx, px, py, wx, wy) {
        const cs = CELL_SIZE;
        const onSurface = wy === SURFACE_ROW;
        // Maanpinnalle jää nurmi puun alle
        if (onSurface) this.drawGrass(ctx, px, py, wx, wy);
        const cx = px + cs / 2;
        // Puu on aina pystyssä — sama ulkonäkö myös pudotessaan monttuun.
        const baseY = onSurface ? (py + cs / 2 - 4) : (py + cs - 2);
        // runko (pysty)
        ctx.fillStyle = '#5a3d1f';
        ctx.fillRect(cx - 3, baseY - 14, 6, 14);
        // latvus
        ctx.fillStyle = '#2e7d32';
        ctx.beginPath();
        ctx.arc(cx, baseY - 19, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#388e3c';
        ctx.beginPath();
        ctx.arc(cx - 4, baseY - 22, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    drawHouse(ctx, px, py, wx, wy) {
        const cs = CELL_SIZE;
        if (wy === SURFACE_ROW) {
            // Talo seisoo maan pinnalla: nurmi jää alle, runko ja katto nousevat ylös
            this.drawGrass(ctx, px, py, wx, wy);
            const baseY = py + cs / 2 - 4; // nurmen yläreuna
            ctx.fillStyle = '#c96b4a';
            ctx.fillRect(px + 4, baseY - 14, cs - 8, 14);
            ctx.fillStyle = '#7d3b28';
            ctx.beginPath();
            ctx.moveTo(px + 2, baseY - 14);
            ctx.lineTo(px + cs / 2, baseY - 30);
            ctx.lineTo(px + cs - 2, baseY - 14);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#5a2d1f';
            ctx.fillRect(px + cs / 2 - 3, baseY - 10, 6, 10);
            ctx.fillStyle = '#ffe08a';
            ctx.fillRect(px + cs / 2 - 8, baseY - 12, 6, 6);
        } else {
            // Kaatunut talo maan alla: kompakti kasa
            ctx.fillStyle = '#c96b4a';
            ctx.fillRect(px + 4, py + cs / 2 - 4, cs - 8, 8);
            ctx.fillStyle = '#7d3b28';
            ctx.beginPath();
            ctx.moveTo(px + 2, py + cs / 2 - 4);
            ctx.lineTo(px + cs / 2, py + cs / 2 - 12);
            ctx.lineTo(px + cs - 2, py + cs / 2 - 4);
            ctx.closePath();
            ctx.fill();
        }
    }

    drawPlayer(ctx, px, py) {
        const cs = CELL_SIZE;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(px + cs / 2, py + cs / 2, cs / 2 - 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#CC8800';
        ctx.fillRect(px + cs / 4, py + 2, cs / 2, cs / 4);
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(px + cs / 2 - 5, py + cs / 2 - 4, 2.5, 0, Math.PI * 2);
        ctx.arc(px + cs / 2 + 5, py + cs / 2 - 4, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#960';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px + cs / 2, py + cs / 2, cs / 2 - 3, 0, Math.PI * 2);
        ctx.stroke();
    }

    renderAnimations(ctx, offsetX) {
        for (const a of this.animations) {
            const cx = a.x - offsetX + CELL_SIZE / 2;
            const cy = a.y + CELL_SIZE / 2;

            if (a.type === 'death') {
                const alpha = 1 - a.frame / a.maxFrames;
                ctx.strokeStyle = `rgba(255, ${Math.floor(120 * (1 - a.frame / a.maxFrames))}, 0, ${alpha})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx, cy, a.frame * 5, 0, Math.PI * 2);
                ctx.stroke();
                ctx.strokeStyle = `rgba(255, 255, 150, ${alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx, cy, a.frame * 3, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = `rgba(255, 200, 50, ${alpha})`;
                ctx.beginPath();
                ctx.arc(cx, cy, Math.max(2, 12 - a.frame), 0, Math.PI * 2);
                ctx.fill();
                const parts = 10;
                const seed = (a.x * 31 + a.y * 17) % 100;
                for (let i = 0; i < parts; i++) {
                    const angle = (i / parts) * Math.PI * 2 + seed * 0.01;
                    const dist = a.frame * 4;
                    ctx.fillStyle = `rgba(255, ${150 + Math.floor(100 * Math.random())}, 0, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                const alpha = 1 - a.frame / a.maxFrames;
                ctx.strokeStyle = `rgba(255, 255, 0, ${alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx, cy, a.frame * 3, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
    }

    renderParticles(ctx, offsetX) {
        for (const p of this.particles) {
            const alpha = p.life / p.maxLife;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = alpha;
            ctx.fillRect(p.x - offsetX - p.size / 2, p.y - p.size / 2, p.size, p.size);
        }
        ctx.globalAlpha = 1;
    }

    drawGrid(ctx, cols, rows, cs, offsetX) {
        const offX = offsetX ? (offsetX % cs) : 0;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 0.5;
        for (let x = 0; x <= cols; x++) {
            ctx.beginPath();
            ctx.moveTo(x * cs - offX, 0);
            ctx.lineTo(x * cs - offX, rows * cs);
            ctx.stroke();
        }
        for (let y = 0; y <= rows; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y * cs);
            ctx.lineTo(cols * cs, y * cs);
            ctx.stroke();
        }
    }
}




// input.js - Näppäimistön ja kosketuksen käsittely

class InputHandler {
    constructor(game) {
        this.game = game;
        this.spaceHeld = false;
        this.setupKeyboard();
        this.setupTouch();
    }

    setupKeyboard() {
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W':
                    e.preventDefault();
                    this.dirInput(DIR.UP);
                    break;
                case 'ArrowDown': case 's': case 'S':
                    e.preventDefault();
                    this.dirInput(DIR.DOWN);
                    break;
                case 'ArrowLeft': case 'a': case 'A':
                    e.preventDefault();
                    this.dirInput(DIR.LEFT);
                    break;
                case 'ArrowRight': case 'd': case 'D':
                    e.preventDefault();
                    this.dirInput(DIR.RIGHT);
                    break;
                case ' ':
                    e.preventDefault();
                    this.spaceHeld = true;
                    this.game.spaceAction();
                    break;
                case 'Enter':
                    e.preventDefault();
                    this.game.handleConfirm();
                    break;
                case 'r': case 'R':
                    this.game.restartWorld();
                    break;
                case 'p': case 'P':
                    this.game.togglePause();
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === ' ') {
                this.spaceHeld = false;
            }
        });
    }

    // Suuntanäppäin: space pohjassa = etäkaivu, muuten liiku
    dirInput(dir) {
        if (this.spaceHeld) {
            this.game.remoteDig(dir);
        } else {
            this.game.movePlayer(dir);
        }
    }

    setupTouch() {
        // Suuntanäppäimet: space pohjassa = etäkaivu, muuten liiku
        const buttons = document.querySelectorAll('.touch-btn[data-dir]');
        const dirMap = {
            'up': DIR.UP,
            'down': DIR.DOWN,
            'left': DIR.LEFT,
            'right': DIR.RIGHT,
        };
        buttons.forEach(btn => {
            const handler = (e) => {
                e.preventDefault();
                this.dirInput(dirMap[btn.dataset.dir]);
            };
            btn.addEventListener('touchstart', handler, { passive: false });
            btn.addEventListener('touchend', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
            btn.addEventListener('mousedown', handler);
        });

        // Ympyränappi imitoi välilyöntiä: pohjassa = etäkaivu-tila
        const spaceBtn = document.getElementById('space-btn');
        if (spaceBtn) {
            const press = (e) => {
                e.preventDefault();
                this.spaceHeld = true;
                spaceBtn.classList.add('active');
            };
            const release = (e) => {
                e.preventDefault();
                this.spaceHeld = false;
                spaceBtn.classList.remove('active');
            };
            spaceBtn.addEventListener('touchstart', press, { passive: false });
            spaceBtn.addEventListener('mousedown', press);
            spaceBtn.addEventListener('touchend', release);
            spaceBtn.addEventListener('touchcancel', release);
            spaceBtn.addEventListener('mouseup', release);
            spaceBtn.addEventListener('mouseleave', release);
        }
    }
}


// audio.js - Prosedyraaliset ääniefektit (Web Audio API)
const AudioFX = (() => {
    let ctx = null;

    function init() {
        if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (ctx.state === 'suspended') ctx.resume();
    }

    // Herätä äänikonteksti ensimmäisestä käyttäjän toiminnosta
    document.addEventListener('touchstart', init, { once: true, passive: true });
    document.addEventListener('touchend', init, { once: true, passive: true });
    document.addEventListener('mousedown', init, { once: true });
    document.addEventListener('keydown', init, { once: true });

    // Kevyt rapina liikkuessa / kaivaessa
    function playMove() {
        try {
            init();
            const now = ctx.currentTime;
            const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.08), ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.015));
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 2000;
            filter.Q.value = 0.5;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.10, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            src.connect(filter).connect(gain).connect(ctx.destination);
            src.start(now);
            src.stop(now + 0.08);
        } catch(e) {}
    }

    // Napsaus timantin keräämisessä
    function playDiamond() {
        try {
            init();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.13, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
        } catch(e) {}
    }

    // Kevyt räjähdys kuolemassa
    function playExplosion() {
        try {
            init();
            const now = ctx.currentTime;
            const dur = 6.0;
            const peak = 2.5;

            // Kerros 1: Jyrisevä kohina
            const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                data[i] = (Math.random() * 2 - 1);
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const lpFilter = ctx.createBiquadFilter();
            lpFilter.type = 'lowpass';
            lpFilter.frequency.setValueAtTime(300, now);
            lpFilter.frequency.exponentialRampToValueAtTime(40, now + dur);
            const lpGain = ctx.createGain();
            lpGain.gain.setValueAtTime(0.08, now);
            lpGain.gain.linearRampToValueAtTime(0.30, now + peak);
            lpGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
            src.connect(lpFilter).connect(lpGain).connect(ctx.destination);
            src.start(now);
            src.stop(now + dur);

            // Kerros 2: Matala bassojyrinä
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(60, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + dur);
            const oscGain = ctx.createGain();
            oscGain.gain.setValueAtTime(0.10, now);
            oscGain.gain.linearRampToValueAtTime(0.35, now + peak);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
            osc.connect(oscGain).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + dur);

            // Kerros 3: Terävä aloitusräsähdys
            const crackDur = 0.08;
            const crackBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * crackDur), ctx.sampleRate);
            const crackData = crackBuf.getChannelData(0);
            for (let i = 0; i < crackData.length; i++) {
                crackData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.006));
            }
            const crackSrc = ctx.createBufferSource();
            crackSrc.buffer = crackBuf;
            const hpFilter = ctx.createBiquadFilter();
            hpFilter.type = 'highpass';
            hpFilter.frequency.value = 1500;
            const crackGain = ctx.createGain();
            crackGain.gain.setValueAtTime(0.15, now);
            crackGain.gain.exponentialRampToValueAtTime(0.001, now + crackDur);
            crackSrc.connect(hpFilter).connect(crackGain).connect(ctx.destination);
            crackSrc.start(now);
            crackSrc.stop(now + crackDur);
        } catch(e) {}
    }

    // Lyhyt räjähdys vihollisen murskaamisessa
    function playCrush() {
        try {
            init();
            const now = ctx.currentTime;
            const dur = 0.3;
            const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.06));
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 500;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.20, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
            src.connect(filter).connect(gain).connect(ctx.destination);
            src.start(now);
            src.stop(now + dur);
        } catch(e) {}
    }

    // Tömähdys, kun kivi/puu/talo putoaa ja pysähtyy
    function playThud() {
        try {
            init();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        } catch(e) {}
    }

    return { playMove, playDiamond, playExplosion, playCrush, playThud };
})();


// game.js - Pelin pääohjain (yksi yhtenäinen maailma, ei tasoja)

class Game {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.renderer = new Renderer(this.canvas, this);
        this.physics = new Physics(this);
        this.enemyAI = new EnemyAI(this);
        this.input = new InputHandler(this);

        this.grid = [];
        this.cols = 0;
        this.rows = WORLD_ROWS;
        this.player = { x: 0, y: 0, facing: DIR.RIGHT };
        this.playerStartX = 0;
        this.playerStartY = 0;
        this.diamondsCollected = 0;
        this.score = 0;
        this.lives = INITIAL_LIVES;
        this.paused = false;
        this.gameOver = false;
        this.worldComplete = false;
        this.animFrameId = null;
        this.lastFrameTime = 0;
        this.lastEnemyMove = 0;
        this.deathEnd = 0;

        this.overlay = document.getElementById('overlay');
        this.overlayTitle = document.getElementById('overlay-title');
        this.overlayMessage = document.getElementById('overlay-message');
        this.overlayButton = document.getElementById('overlay-button');
        const confirmAction = (e) => {
            if (e && e.cancelable) e.preventDefault();
            this.handleConfirm();
        };
        this.overlayButton.addEventListener('click', confirmAction);
        this.overlayButton.addEventListener('touchstart', confirmAction, { passive: false });

        // Tausta-ajon hallinta: välilehti taustalle -> tauko
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && !this.paused && !this.gameOver && !this.worldComplete) {
                this.togglePause();
            }
        });

        this.startGame();
    }

    startGame(skipIntro) {
        this.score = 0;
        this.lives = INITIAL_LIVES;
        this.diamondsCollected = 0;
        this.gameOver = false;
        this.worldComplete = false;
        this.deathEnd = 0;
        this.paused = !skipIntro;
        this.hideOverlay();
        this.buildWorld();
        this.updateHUD();
        this.renderer.resize();
        this.startLoop();

        if (!skipIntro) {
            this.showOverlay('⛏️ Dig Game',
                'Kulje maailman halki vasemmalta oikealle!\n\n' +
                'Kävele maan pinnalla. Kaivaudu maan alle ja\n' +
                'pudota puut ja talot monttuun kaivamalla niiden\n' +
                'alta, jotta pääset eteenpäin.\n\n' +
                'Taivaalle ei voi kiivetä, eikä maan pinnalla\n' +
                'tarvitse syödä mitään.\n\n' +
                'Etsi avain maailman itäpäästä!',
                'Aloita kaivamaan');
        }
        this.renderer.render();
    }

    // Rakentaa (uudelleen) yhtenäisen maailman
    buildWorld() {
        const world = buildWorld();
        this.grid = world.grid;
        this.cols = world.width;
        this.rows = world.height;
        this.player.x = world.playerStartX;
        this.player.y = world.playerStartY;
        this.playerStartX = world.playerStartX;
        this.playerStartY = world.playerStartY;
        this.player.facing = DIR.RIGHT;
        this.physics.reset();
        this.enemyAI.scanEnemies();
        this.lastEnemyMove = performance.now();
    }

    // Kuoleman jälkeen pelaaja palaa alkuun (maailma säilyy kaivettuna)
    respawnPlayer() {
        this.player.x = this.playerStartX;
        this.player.y = this.playerStartY;
        this.player.facing = DIR.RIGHT;
    }

    restartWorld() {
        this.startGame(true);
        this.updateHUD();
        this.renderer.render();
    }

    movePlayer(dir) {
        if (this.paused || this.gameOver || this.worldComplete || this.deathEnd > 0) return;
        const oldX = this.player.x, oldY = this.player.y;

        this.player.facing = dir;

        const nx = this.player.x + dir.dx;
        const ny = this.player.y + dir.dy;

        if (nx < 0 || nx >= this.cols || ny < 0 || ny >= this.rows) {
            this.applyGravity();
            this.lastFrameTime = performance.now();
            this.updateHUD();
            this.renderer.render();
            return;
        }

        const targetTile = this.grid[ny][nx];

        switch (targetTile) {
            case TILE.EMPTY:
            case TILE.GRASS:      // maanpinta: kävellään, ei kaiveta
                this.player.x = nx; this.player.y = ny;
                break;
            case TILE.DIRT:       // maan alla: kaivetaan
                this.grid[ny][nx] = TILE.EMPTY;
                this.player.x = nx; this.player.y = ny;
                this.renderer.addCrumbs(nx, ny);
                break;
            case TILE.DIAMOND:
                this.grid[ny][nx] = TILE.EMPTY;
                this.player.x = nx; this.player.y = ny;
                this.collectDiamond();
                break;
            case TILE.BOULDER:
            case TILE.TREE:
            case TILE.HOUSE: {   // kaikki objektit työnnettäviä
                const bx = nx + dir.dx;
                const by = ny + dir.dy;
                // Työnnetään vain, jos takana on tyhjää.
                // Jos 2 objektia on kasassa peräkkäin, ei voi työntää.
                if (bx >= 0 && bx < this.cols && by >= 0 && by < this.rows &&
                    this.grid[by][bx] === TILE.EMPTY) {
                    this.grid[by][bx] = targetTile;
                    this.grid[ny][nx] = TILE.EMPTY;
                    this.player.x = nx; this.player.y = ny;
                }
                break;
            }
            case TILE.EXIT:
                // Kerää avain ja poista se ruudusta
                this.grid[ny][nx] = (ny === SURFACE_ROW) ? TILE.GRASS : TILE.EMPTY;
                this.collectKey();
                return;
            case TILE.FIREFLY:
            case TILE.BUTTERFLY:
                this.killPlayer();
                return;
            case TILE.WALL:
            case TILE.SKY:        // taivaalle ei voi kiivetä
                break;
        }

        if (this.player.x !== oldX || this.player.y !== oldY) AudioFX.playMove();
        this.applyGravity();
        this.lastFrameTime = performance.now();
        this.updateHUD();
        this.renderer.render();
    }

    // Syö yksi multapala/timantti "etänä" annettuun suuntaan (ei liiku)
    remoteDig(dir) {
        if (this.paused || this.gameOver || this.worldComplete || this.deathEnd > 0) return;
        const d = dir || this.player.facing;
        this.player.facing = d;
        const nx = this.player.x + d.dx;
        const ny = this.player.y + d.dy;
        if (nx >= 0 && nx < this.cols && ny >= 0 && ny < this.rows) {
            const tile = this.grid[ny][nx];
            if (tile === TILE.DIRT) {
                this.grid[ny][nx] = TILE.EMPTY;
                this.renderer.addCrumbs(nx, ny);
            } else if (tile === TILE.DIAMOND) {
                this.grid[ny][nx] = TILE.EMPTY;
                this.collectDiamond();
            } else if (tile === TILE.BOULDER || tile === TILE.TREE || tile === TILE.HOUSE) {
                // Tartu objektiin ja vedä se pelaajan paikalle (vaihdetaan paikkaa).
                // Alin prioriteetti: multa ja timantti hoidetaan ensin.
                const ox = this.player.x, oy = this.player.y;
                // Kiveä ei voi vetää maanpinnalle (nurmelle) — se jäisi "ylimääräiseksi"
                // objektiksi pinnalle ja estäisi jatkosiirrot.
                if (tile === TILE.BOULDER && oy === SURFACE_ROW) return;
                this.grid[oy][ox] = tile;
                // Jos puu/talo vedetään pois pinnalta, jää nurmi jäljelle
                this.grid[ny][nx] =
                    (ny === SURFACE_ROW && (tile === TILE.TREE || tile === TILE.HOUSE))
                    ? TILE.GRASS : TILE.EMPTY;
                this.player.x = nx;
                this.player.y = ny;
            } else {
                return; // taivasta, seinää tms. ei voi syödä tai tarttua
            }
            this.applyGravity();
            this.lastFrameTime = performance.now();
            this.updateHUD();
            this.renderer.render();
        }
    }

    // Välilyönti: pelin tilan siirtymät
    spaceAction() {
        if (this.gameOver) {
            this.startGame(true);
        } else if (this.worldComplete) {
            this.startGame(true);
        } else if (this.paused) {
            this.togglePause();
        }
    }

    // Enter / overlay-nappi: jatka tilan mukaan
    handleConfirm() {
        if (this.gameOver) {
            this.startGame(true);
        } else if (this.worldComplete) {
            this.startGame(true);
        } else if (this.paused) {
            this.togglePause();
        }
    }

    togglePause() {
        if (this.gameOver || this.worldComplete) return;
        this.paused = !this.paused;
        if (this.paused) {
            this.showOverlay('⏸️ Tauko', 'Paina P tai Enter jatkaaksesi', 'Jatka');
        } else {
            this.hideOverlay();
        }
    }

    collectDiamond() {
        this.diamondsCollected++;
        this.score += SCORE_DIAMOND;
        AudioFX.playDiamond();
    }

    // Puun/talon pudotus pinnalta monttuun
    awardDrop() {
        this.score += SCORE_DROP;
        this.updateHUD();
    }

    applyGravity() {
        this.physics.updateAll();
    }

    killPlayer() {
        if (this.deathEnd > 0) return; // jo kuolemassa
        AudioFX.playExplosion();
        this.renderer.addDeathExplosion(this.player.x, this.player.y);
        this.deathEnd = performance.now() + 3000;
        this.renderer.render();
    }

    finalizeKill() {
        this.lives--;
        this.updateHUD();
        if (this.lives <= 0) {
            this.showOverlay('💀 Kuolit!',
                'Elämät loppuivat! Pisteet: ' + this.score,
                'Pelaa uudelleen');
            this.gameOver = true;
            this.stopLoop();
        } else {
            this.respawnPlayer();
        }
        this.renderer.render();
    }

    completeWorld() {
        this.score += SCORE_WORLD_BONUS;
        this.worldComplete = true;
        this.showOverlay('🎉 Maailma läpäisty!',
            'Löysit tien maailman itäpäähän!\n\n' +
            'Kerätyt timantit: ' + this.diamondsCollected +
            '\nPisteet: ' + this.score,
            'Pelaa uudelleen');
        this.updateHUD();
        this.renderer.render();
    }
collectKey() {
        this.score += SCORE_WORLD_BONUS;
        this.worldComplete = true;
        this.showOverlay('🔑 Avain löytyi!',
            'Nyt pääset pelaamaan\nBoulder Dashia pääkadulla!\n\n' +
            'Kerätyt timantit: ' + this.diamondsCollected +
            '\nPisteet: ' + this.score,
            'OK');
        // Ilmoita pääsivulle että avain on kerätty
        try { window.parent.postMessage('KEY_COLLECTED', '*'); } catch(e) {}
        this.updateHUD();
        this.renderer.render();
    }

    spawnExplosion(x, y) {
        this.renderer.addExplosion(x, y);
    }

    updateHUD() {
        const progress = Math.max(0, Math.min(100,
            Math.round((this.player.x / Math.max(1, this.cols - 1)) * 100)));
        const progEl = document.getElementById('progress-display');
        if (progEl) progEl.textContent = 'Matka: ' + progress + '%';
        document.getElementById('diamond-display').textContent =
            '💎 ' + this.diamondsCollected;
        document.getElementById('score-display').textContent =
            'Pisteet: ' + this.score;
        document.getElementById('lives-display').textContent =
            '❤️ ' + this.lives;
    }

    showOverlay(title, message, buttonText) {
        this.overlayTitle.textContent = title;
        this.overlayMessage.textContent = message;
        this.overlayButton.textContent = buttonText;
        this.overlay.classList.remove('hidden');
    }

    hideOverlay() {
        this.overlay.classList.add('hidden');
    }

    startLoop() {
        this.stopLoop();
        this.lastFrameTime = performance.now();
        this.lastEnemyMove = performance.now();
        this.loop(this.lastFrameTime);
    }

    stopLoop() {
        if (this.animFrameId) {
            cancelAnimationFrame(this.animFrameId);
            this.animFrameId = null;
        }
    }

    loop(timestamp) {
        if (this.gameOver) return;
        this.animFrameId = requestAnimationFrame((t) => this.loop(t));
        this.renderer.updateAnimations();

        // Kuoleman viive: näytä räjähdys, sitten suorita kuolema
        if (this.deathEnd > 0) {
            if (timestamp >= this.deathEnd) {
                this.deathEnd = 0;
                this.finalizeKill();
            } else {
                this.renderer.render();
                return;
            }
        }

        if (!this.paused && !this.worldComplete) {
            // Painovoima joka kehyksellä
            if (timestamp - this.lastFrameTime >= FRAME_DELAY) {
                this.lastFrameTime = timestamp;
                this.applyGravity();
                this.updateHUD();
            }
            // Viholliset liikkuvat hitaammin -> pelaaja ehtii karkuun
            if (timestamp - this.lastEnemyMove >= ENEMY_DELAY) {
                this.lastEnemyMove = timestamp;
                this.enemyAI.updateAll();
                this.updateHUD();
            }
        }
        this.renderer.render();
    }
}

window.addEventListener('DOMContentLoaded', () => {
    new Game();
});


</script>
