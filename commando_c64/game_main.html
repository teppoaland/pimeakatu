<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔫 Commando</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <header id="game-header">
            <h1>🔫 COMMANDO</h1>
            <div id="game-info">
                <span id="lives-display">❤️ 3</span>
                <span id="grenade-display">💣 6</span>
                <span id="score-display">⭐ 0</span>
                <span id="progress-display">📏 0m</span>
            </div>
        </header>

        <div id="game-area">
            <canvas id="game-canvas" tabindex="0"></canvas>

            <div id="touch-controls">
                <div id="touch-left">
                    <button class="touch-btn" id="fire-btn" title="Ammu (Space)">🔫</button>
                    <button class="touch-btn" id="grenade-btn" title="Kranaatti (B)">💣</button>
                </div>
                <div id="touch-right">
                    <div class="touch-dpad">
                        <button class="touch-btn up" data-dir="up">▲</button>
                        <button class="touch-btn left" data-dir="left">◄</button>
                        <button class="touch-btn right" data-dir="right">►</button>
                        <button class="touch-btn down" data-dir="down">▼</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="keyboard-hints">
            <span>⬆️⬇️⬅️➡️ / WASD = Liiku</span>
            <span>Space = Ammu</span>
            <span>B = Kranaatti</span>
            <span>Enter = Aloita</span>
        </div>

        <div id="notification-area"></div>

        <div id="commando-version">v1.2</div>
    </div>

    <div id="overlay">
        <div id="overlay-content">
            <h2 id="overlay-title">🔫 COMMANDO</h2>
            <p id="overlay-message">Super Joe vastaan vihollisen joukot!<br><br>⬆️⬇️⬅️➡️ / WASD = Liiku<br>🔫 Space = Ammu<br>💣 B = Kranaatti</p>
            <button id="overlay-button">▶ PELAA</button>
        </div>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('game-canvas');
            if (canvas) Commando.init(canvas);
        });
        window.addEventListener('resize', () => {
            if (Commando.rs) Commando.rs();
        });
    </script>
</body>
</html>
