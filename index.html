<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏮 Pimeä Katu – Peliportaali</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ═══ PÄÄNÄKYMÄ ═══════════════════════════════════ -->
    <div id="game-wrapper">
        <!-- Reset-nappi -->
        <button id="reset-btn" title="Aloita alusta">✕</button>

        <!-- HUD-palkki -->
        <div id="hud-bar">Liiku kadulla, potki kaikkea, mutta omalla vastuulla. Saattaa asukkaat hermostua!</div>

        <!-- Pää-canvas (street.js) -->
        <div id="game-area">
            <canvas id="game-canvas" tabindex="0"></canvas>
            <div id="touch-row">
                <div id="touch-left">
                    <button class="touch-btn action" id="action-btn" title="Potku"></button>
                </div>
                <div id="touch-right">
                    <div class="touch-dpad">
                        <button class="touch-btn up"    id="btn-up">▲</button>
                        <button class="touch-btn left"  id="btn-left">◄</button>
                        <button class="touch-btn right" id="btn-right">►</button>
                        <button class="touch-btn down"  id="btn-down">▼</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ilmoitus -->
        <div id="notification"></div>

        <!-- Versionumero -->
        <div id="version-tag">v3.43</div>
    </div>

    <!-- ═══ PELI-IFRAME (alapelit) ═══════════════════════ -->
    <div id="game-iframe-overlay">
        <button id="iframe-close-btn" title="Takaisin kadulle">✕</button>
        <iframe src="" allow="autoplay"></iframe>
    </div>

    <!-- ═══ SKRIPTIT ═════════════════════════════════════ -->
    <script src="gameState.js"></script>
    <script src="audio.js"></script>
    <script src="street.js"></script>

    <!-- Reset-nappi + Iframe-sulkunappi -->
    <script>
        // Sulkunappi (iframe)
        document.getElementById('iframe-close-btn').addEventListener('click', () => {
            if (typeof Street !== 'undefined' && Street.closeGame) {
                Street.closeGame();
            }
        });

        // Reset-nappi – tyhjennä localStorage ja aloita alusta
        document.getElementById('reset-btn').addEventListener('click', () => {
            if (confirm('Haluatko varmasti aloittaa alusta?\nKaikki edistyminen katoaa.')) {
                localStorage.removeItem('pimeakatu_gamestate');
                location.reload();
            }
        });
    </script>
</body>
</html>
