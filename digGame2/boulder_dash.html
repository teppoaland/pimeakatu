    border-radius: 50%;

<script>
// constants.js - Pelin vakiot ja ruututyypit

    EMPTY:   0,   // Tyhjä tila

    WALL:    2,   // Seinä (tuhoutumaton)
    BOULDER: 3,   // Kivi (putoava)

    EXIT:    5,   // Uloskäynti (lukossa, aukeaa timanteilla)

    KEY:     10,  // Avain (kerättävä, avaa uloskäynnin)
});

    [TILE.BUTTERFLY]: '#FF8800',

const GRAVITY_DELAY = 1;  // Kehystä putoamiselle (0 = välitön)
const MAX_LEVELS = 4;

// Parsitaan kentät sisäisiksi taulukoiksi
function parseLevel(levelData) {
    const grid = [];
    let playerX = 0, playerY = 0;
    
    for (let y = 0; y < levelData.height; y++) {
        grid[y] = [];
        const row = levelData.map[y] || '';
        for (let x = 0; x < levelData.width; x++) {
            const ch = x < row.length ? row[x] : ' ';
            switch (ch) {
                case '#': grid[y][x] = TILE.WALL; break;
                case '.': grid[y][x] = TILE.DIRT; break;
                case 'o': grid[y][x] = TILE.BOULDER; break;
                case '*': grid[y][x] = TILE.DIAMOND; break;
                case 'P': 
                    grid[y][x] = TILE.EMPTY;
                    playerX = x;
                    playerY = y;
                    break;
                case 'X': grid[y][x] = TILE.EXIT; break;
                case 'F': grid[y][x] = TILE.FIREFLY; break;
                case 'B': grid[y][x] = TILE.BUTTERFLY; break;
                case 'K': grid[y][x] = TILE.KEY; break;
                default:  grid[y][x] = TILE.EMPTY; break;
            }
        }
    }
    
    return {
        grid: grid,
        playerStartX: playerX,
        playerStartY: playerY,
        width: levelData.width,
        height: levelData.height,
        name: levelData.name,
        diamondsNeeded: levelData.diamondsNeeded,
    };
}


// physics.js - Fysiikkamoottori (kivet, timantit, painovoima)

class Physics {
    constructor(game) {
        this.game = game;
        // Aktiivisesti putoavat (vauhti jo saavutettu)
        this.falling = new Set();
        // "Keikahdus": 1 kehyksen viive ennen putoamista
        // (antaa pelaajalle mahdollisuuden ehtiä alta pois)
        this.teetering = new Set();
    }

    reset() {
        this.falling.clear();
        this.teetering.clear();
    }

    key(x, y) { return x + ',' + y; }

    // Onko ruutu läpäistävissä pelaajalle
    isPassable(x, y) {
        if (x < 0 || x >= this.game.cols || y < 0 || y >= this.game.rows) return false;
        const tile = this.game.grid[y][x];
        return tile === TILE.EMPTY || tile === TILE.DIRT || tile === TILE.DIAMOND || tile === TILE.EXIT;
    }

    // Voiko kivi/timantti pudota tähän (tyhjä tila, ei pelaajaa)
    canFallInto(x, y) {
        if (x < 0 || x >= this.game.cols || y < 0 || y >= this.game.rows) return false;
        if (this.game.grid[y][x] !== TILE.EMPTY) return false;
        if (this.game.player.x === x && this.game.player.y === y) return false;
        return true;
    }

    // Onko pelaaja suoraan tämän ruudun alla
    isPlayerBelow(x, y) {
        return this.game.player.x === x && this.game.player.y === y + 1;
    }

    // Tarkista voiko peliobjekti (kivi, timantti) liikkua alas
    updateFalling(x, y) {
        const tile = this.game.grid[y][x];
        if (tile !== TILE.BOULDER && tile !== TILE.DIAMOND) return false;

        const k = this.key(x, y);

        if (y + 1 >= this.game.rows) {
            this.falling.delete(k);
            this.teetering.delete(k);
            return false;
        }

        const below = this.game.grid[y + 1][x];
        const playerBelow = this.isPlayerBelow(x, y);

        // Putoaminen tyhjään tilaan
        if (below === TILE.EMPTY) {
            // Pelaaja alla TUKEE kiveä/timanttia -> ei putoa
            // (ellei se ole jo vauhdissa)
            if (playerBelow && !this.falling.has(k)) {
                this.teetering.delete(k);
                return false;
            }

            // Keikahdus: 1 kehyksen viive ennen putoamista
            if (!this.falling.has(k) && !this.teetering.has(k)) {
                this.teetering.add(k);
                return false;
            }

            // Nyt pudotaan yksi ruutu
            this.teetering.delete(k);
            this.falling.delete(k);
            this.game.grid[y][x] = TILE.EMPTY;

            if (playerBelow) {
                if (tile === TILE.BOULDER) {
                    this.game.killPlayer();
                } else {
                    this.game.collectDiamond();
                }
            } else {
                this.game.grid[y + 1][x] = tile;
                this.falling.add(this.key(x, y + 1));
                this.checkEnemyCrush(x, y + 1, tile);
            }
            return true;
        }

        // Alla kova ruutu -> pysähtyy
        this.falling.delete(k);
        this.teetering.delete(k);

        // Liukuminen kiven/timantin reunalta
        if (below === TILE.BOULDER || below === TILE.DIAMOND) {
            if (this.canFallInto(x - 1, y) && this.canFallInto(x - 1, y + 1)) {
                this.game.grid[y][x] = TILE.EMPTY;
                this.game.grid[y][x - 1] = tile;
                this.checkEnemyCrush(x - 1, y, tile);
                return true;
            }
            if (this.canFallInto(x + 1, y) && this.canFallInto(x + 1, y + 1)) {
                this.game.grid[y][x] = TILE.EMPTY;
                this.game.grid[y][x + 1] = tile;
                this.checkEnemyCrush(x + 1, y, tile);
                return true;
            }
        }

        // Kivi murskaa alla olevan vihollisen
        if (tile === TILE.BOULDER &&
            (below === TILE.FIREFLY || below === TILE.BUTTERFLY)) {
            this.game.grid[y][x] = TILE.EMPTY;
            this.checkEnemyCrush(x, y + 1, tile, below);
            return true;
        }

        return false;
    }

    // Tarkista osuiko putoava kivi viholliseen
    checkEnemyCrush(x, y, tile, targetOverride = null) {
        const target = targetOverride !== null ? targetOverride : this.game.grid[y][x];
        if (tile === TILE.BOULDER) {
            if (target === TILE.FIREFLY) {
                this.game.grid[y][x] = TILE.BOULDER;
                this.game.score += SCORE_ENEMY;
                this.game.updateHUD();
                this.game.spawnExplosion(x, y);
                AudioFX.playCrush();
            } else if (target === TILE.BUTTERFLY) {
                // Perhonen räjähtää 3x3 alueelta ja tuhoaa ympäristön
                this.game.grid[y][x] = TILE.BOULDER;
                this.game.score += SCORE_ENEMY;
                this.explode(x, y, 1);
                this.game.updateHUD();
                AudioFX.playCrush();
            }
        }
    }

    // Käy läpi koko kenttä ja päivitä fysiikka (alhaalta ylös)
    updateAll() {
        let anyMoved = false;
        for (let y = this.game.rows - 1; y >= 0; y--) {
            for (let x = 0; x < this.game.cols; x++) {
                if (this.updateFalling(x, y)) {
                    anyMoved = true;
                }
            }
        }
        return anyMoved;
    }

    // Räjäytä ympäröivät ruudut (tuhoaa kaiken paitsi seinät ja uloskäynnin)
    explode(x, y, radius) {
        for (let dy = -radius; dy <= radius; dy++) {
            for (let dx = -radius; dx <= radius; dx++) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < this.game.cols && ny >= 0 && ny < this.game.rows) {
                    const t = this.game.grid[ny][nx];
                    if (t !== TILE.WALL && t !== TILE.EXIT) {
                        this.game.grid[ny][nx] = TILE.EMPTY;
                        this.game.spawnExplosion(nx, ny);
                        if (this.game.player.x === nx && this.game.player.y === ny) {
                            this.game.killPlayer();
                        }
                    }
                }
            }
        }
    }
}

// enemies.js - Vihollisten tekoäly (tulikärpäset ja perhoset)

class EnemyAI {
    constructor(game) {
        this.game = game;
        this.enemyStates = []; // pysyvät tilat: {x, y, type, dirIndex}
    }

    // Kerää kaikki viholliset kentältä (kutsutaan kerran tasoa ladattaessa)
    scanEnemies() {
        this.enemyStates = [];
        for (let y = 0; y < this.game.rows; y++) {
            for (let x = 0; x < this.game.cols; x++) {
                const tile = this.game.grid[y][x];
                if (tile === TILE.FIREFLY || tile === TILE.BUTTERFLY) {
                    this.enemyStates.push({
                        x: x, y: y, type: tile,
                        dirIndex: Math.floor(Math.random() * 4),
                    });
                }
            }
        }
    }

    // Suunnat: tulikärpänen kääntyy vasemmalle (CCW), perhonen oikealle (CW)
    getDirections(type) {
        if (type === TILE.FIREFLY) {
            return [DIR.UP, DIR.RIGHT, DIR.DOWN, DIR.LEFT];
        }
        return [DIR.RIGHT, DIR.DOWN, DIR.LEFT, DIR.UP];
    }

    // Liikuta yhtä vihollista
    moveEnemy(enemy) {
        const dirs = this.getDirections(enemy.type);

        // Tulikärpänen suosii vasemmalle (CCW), perhonen oikealle (CW)
        const first = enemy.type === TILE.FIREFLY
            ? (enemy.dirIndex + 3) % 4  // CCW
            : (enemy.dirIndex + 1) % 4; // CW
        const second = enemy.dirIndex;                    // eteenpäin
        const third = enemy.type === TILE.FIREFLY
            ? (enemy.dirIndex + 1) % 4   // CW
            : (enemy.dirIndex + 3) % 4;  // CCW
        const fourth = (enemy.dirIndex + 2) % 4;          // ympäri

        const order = [first, second, third, fourth];

        for (const idx of order) {
            const d = dirs[idx];
            const nx = enemy.x + d.dx;
            const ny = enemy.y + d.dy;
            if (this.isEnemyPassable(nx, ny)) {
                this.moveEnemyTo(enemy, nx, ny);
                enemy.dirIndex = idx;
                return;
            }
        }
    }

    isEnemyPassable(x, y) {
        if (x < 0 || x >= this.game.cols || y < 0 || y >= this.game.rows) return false;
        // Viholliset liikkuvat vain tyhjässä tilassa (ei mullassa, kivissä, timanteissa)
        return this.game.grid[y][x] === TILE.EMPTY;
    }

    moveEnemyTo(enemy, newX, newY) {
        const oldX = enemy.x;
        const oldY = enemy.y;

        // Törmäys pelaajaan
        if (this.game.player.x === newX && this.game.player.y === newY) {
            this.game.killPlayer();
            return;
        }

        this.game.grid[oldY][oldX] = TILE.EMPTY;
        this.game.grid[newY][newX] = enemy.type;
        enemy.x = newX;
        enemy.y = newY;
    }

    // Tarkista onko vihollinen pelaajan ruudussa
    checkPlayerCollision() {
        for (const enemy of this.enemyStates) {
            if (enemy.x === this.game.player.x && enemy.y === this.game.player.y) {
                this.game.killPlayer();
                return true;
            }
        }
        return false;
    }

    // Päivitä kaikki viholliset
    updateAll() {
        // Poista murskatut viholliset (kivi/timantti korvannut ruudun)
        this.enemyStates = this.enemyStates.filter(e =>
            this.game.grid[e.y][e.x] === e.type
        );
        for (const enemy of this.enemyStates) {
            this.moveEnemy(enemy);
        }
        this.checkPlayerCollision();
    }
}

// renderer.js - Canvas-piirtäjä, osa 1

class Renderer {
    constructor(canvas, game) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.game = game;
        this.animations = [];
        this.flashAlpha = 0;
    }

    resize() {
        const cols = this.game.cols || 20;
        const rows = this.game.rows || 15;
        this.canvas.width = cols * CELL_SIZE;
        this.canvas.height = rows * CELL_SIZE;
    }

    addExplosion(x, y) {
        this.animations.push({
            x: x * CELL_SIZE, y: y * CELL_SIZE,
            frame: 0, maxFrames: 6,
        });
    }

    addDeathExplosion(x, y) {
        this.animations.push({
            x: x * CELL_SIZE, y: y * CELL_SIZE,
            frame: 0, maxFrames: 20,
            type: 'death',
        });
        this.flashAlpha = 0.4;
    }

    updateAnimations() {
        this.animations = this.animations.filter(a => {
            a.frame++;
            return a.frame < a.maxFrames;
        });
        if (this.flashAlpha > 0) {
            this.flashAlpha = Math.max(0, this.flashAlpha - 0.015);
        }
    }

    render() {
        const ctx = this.ctx;
        const cols = this.game.cols;
        const rows = this.game.rows;
        const cs = CELL_SIZE;
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                this.drawTile(ctx, x * cs, y * cs, this.game.grid[y][x]);
            }
        }
        if (!this.game.deathEnd) {
            this.drawPlayer(ctx, this.game.player.x * cs, this.game.player.y * cs);
        }
        this.renderAnimations(ctx);
        this.drawGrid(ctx, cols, rows, cs);

        // Ruudun välähdys kuolemassa
        if (this.flashAlpha > 0) {
            ctx.fillStyle = `rgba(255, 30, 0, ${this.flashAlpha})`;
            ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        }
    }

    drawTile(ctx, px, py, tile) {
        const cs = CELL_SIZE;
        const p = 1;
        switch (tile) {
            case TILE.EMPTY: break;
            case TILE.DIRT:
                ctx.fillStyle = '#6B3410';
                ctx.fillRect(px + p, py + p, cs - p * 2, cs - p * 2);
                ctx.fillStyle = '#7B4420';
                const seed = (px * 31 + py * 17) % 100;
                for (let i = 0; i < 5; i++) {
                    const di = (seed + i * 7) % (cs - 10);
                    const dj = (seed * 3 + i * 13) % (cs - 10);
                    ctx.fillRect(px + p + 3 + di, py + p + 3 + dj, 2, 2);
                }
                ctx.strokeStyle = '#4a2008';
                ctx.lineWidth = 1;
                ctx.strokeRect(px + p, py + p, cs - p * 2, cs - p * 2);
                break;
            case TILE.WALL:
                ctx.fillStyle = '#555';
                ctx.fillRect(px + p, py + p, cs - p * 2, cs - p * 2);
                ctx.fillStyle = '#666';
                ctx.fillRect(px + p, py + p, cs - p * 2, (cs - p * 2) / 2);
                ctx.fillStyle = '#444';
                ctx.fillRect(px + p, py + p + (cs - p * 2) / 2, cs - p * 2, (cs - p * 2) / 2);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.strokeRect(px + p, py + p, cs - p * 2, cs - p * 2);
                ctx.beginPath();
                ctx.moveTo(px + p, py + cs / 2);
                ctx.lineTo(px + cs - p, py + cs / 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(px + cs / 2, py + p);
                ctx.lineTo(px + cs / 2, py + cs / 2);
                ctx.stroke();
                break;
            case TILE.BOULDER:
                ctx.fillStyle = '#777';
                ctx.beginPath();
                ctx.arc(px + cs / 2, py + cs / 2, cs / 2 - 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#999';
                ctx.beginPath();
                ctx.arc(px + cs / 2 - 3, py + cs / 2 - 3, cs / 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(px + cs / 2, py + cs / 2, cs / 2 - 3, 0, Math.PI * 2);
                ctx.stroke();
                break;
            case TILE.DIAMOND:
                const s = Math.sin(Date.now() / 300 + px + py) * 0.3 + 0.7;
                ctx.fillStyle = `rgba(0, 200, 255, ${s})`;
                ctx.beginPath();
                ctx.moveTo(px + cs / 2, py + p + 2);
                ctx.lineTo(px + cs - p - 2, py + cs / 2);
                ctx.lineTo(px + cs / 2, py + cs - p - 2);
                ctx.lineTo(px + p + 2, py + cs / 2);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#0AA';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(px + cs / 2 - 3, py + cs / 2 - 2, 4, 0, Math.PI * 2);
                ctx.fill();
                break;
            case TILE.KEY:
                // Kultainen avain (sykkivä hehku)
                const ks = Math.sin(Date.now() / 250 + px + py) * 0.3 + 0.7;
                ctx.fillStyle = `rgba(255, 170, 0, ${ks})`;
                ctx.fillRect(px + cs / 2 - 2, py + 4, 4, cs - 8);
                ctx.beginPath();
                ctx.arc(px + cs / 2, py + cs / 2 - 2, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.arc(px + cs / 2, py + cs / 2 - 2, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = `rgba(255, 170, 0, ${ks})`;
                ctx.fillRect(px + cs / 2 + 2, py + cs - 8, 5, 3);
                ctx.fillRect(px + cs / 2 + 2, py + cs - 13, 5, 3);
                ctx.strokeStyle = '#664400';
                ctx.lineWidth = 1;
                ctx.strokeRect(px + cs / 2 - 2, py + 4, 4, cs - 8);
                break;
case TILE.EXIT:
                const open = this.game.diamondsCollected >= this.game.diamondsNeeded && this.game.keyCollected;
                ctx.fillStyle = open ? '#0F0' : '#030';
                ctx.fillRect(px + 3, py + 3, cs - 6, cs - 6);
                ctx.strokeStyle = open ? '#0F4' : '#060';
                ctx.lineWidth = 3;
                ctx.strokeRect(px + 3, py + 3, cs - 6, cs - 6);
                ctx.fillStyle = open ? '#040' : '#010';
                ctx.font = `${cs * 0.6}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🚪', px + cs / 2, py + cs / 2 + 1);
                break;
            case TILE.FIREFLY:
                this.drawEnemy(ctx, px, py, cs, '#F22', '#F80', '#FC0');
                break;
            case TILE.BUTTERFLY:
                this.drawEnemy(ctx, px, py, cs, '#F60', '#FA0', '#FD4');
                break;
        }
    }

    drawEnemy(ctx, px, py, cs, c1, c2, c3) {
        const pulse = Math.sin(Date.now() / 150) * 2;
        ctx.fillStyle = c1;
        ctx.beginPath();
        ctx.arc(px + cs / 2, py + cs / 2, cs / 2 - 2 + pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = c2;
        ctx.beginPath();
        ctx.arc(px + cs / 2, py + cs / 2, cs / 2 - 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = c3;
        ctx.beginPath();
        ctx.arc(px + cs / 2 - 3, py + cs / 2 - 3, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    drawPlayer(ctx, px, py) {
        const cs = CELL_SIZE;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(px + cs / 2, py + cs / 2, cs / 2 - 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#CC8800';
        ctx.fillRect(px + cs / 4, py + 2, cs / 2, cs / 4);
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(px + cs / 2 - 5, py + cs / 2 - 4, 2.5, 0, Math.PI * 2);
        ctx.arc(px + cs / 2 + 5, py + cs / 2 - 4, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#960';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px + cs / 2, py + cs / 2, cs / 2 - 3, 0, Math.PI * 2);
        ctx.stroke();
    }

    renderAnimations(ctx) {
        for (const a of this.animations) {
            const cx = a.x + CELL_SIZE / 2;
            const cy = a.y + CELL_SIZE / 2;

            if (a.type === 'death') {
                const alpha = 1 - a.frame / a.maxFrames;

                // Ulompi rengas (oranssi/punainen)
                ctx.strokeStyle = `rgba(255, ${Math.floor(120 * (1 - a.frame / a.maxFrames))}, 0, ${alpha})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx, cy, a.frame * 5, 0, Math.PI * 2);
                ctx.stroke();

                // Sisempi rengas (kirkkaan keltainen)
                ctx.strokeStyle = `rgba(255, 255, 150, ${alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx, cy, a.frame * 3, 0, Math.PI * 2);
                ctx.stroke();

                // Keskusta (hehkuva ydin)
                ctx.fillStyle = `rgba(255, 200, 50, ${alpha})`;
                ctx.beginPath();
                ctx.arc(cx, cy, Math.max(2, 12 - a.frame), 0, Math.PI * 2);
                ctx.fill();

                // Sirpaleet (lentävät kipinät)
                const parts = 10;
                const seed = (a.x * 31 + a.y * 17) % 100;
                for (let i = 0; i < parts; i++) {
                    const angle = (i / parts) * Math.PI * 2 + seed * 0.01;
                    const dist = a.frame * 4;
                    ctx.fillStyle = `rgba(255, ${150 + Math.floor(100 * Math.random())}, 0, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                const alpha = 1 - a.frame / a.maxFrames;
                ctx.strokeStyle = `rgba(255, 255, 0, ${alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx, cy, a.frame * 3, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
    }

    drawGrid(ctx, cols, rows, cs) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 0.5;
        for (let x = 0; x <= cols; x++) {
            ctx.beginPath();
            ctx.moveTo(x * cs, 0);
            ctx.lineTo(x * cs, rows * cs);
            ctx.stroke();
        }
        for (let y = 0; y <= rows; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y * cs);
            ctx.lineTo(cols * cs, y * cs);
            ctx.stroke();
        }
    }
}


// input.js - Näppäimistön ja kosketuksen käsittely

class InputHandler {
    constructor(game) {
        this.game = game;
        this.spaceHeld = false;
        this.setupKeyboard();
        this.setupTouch();
    }

    setupKeyboard() {
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W':
                    e.preventDefault();
                    this.dirInput(DIR.UP);
                    break;
                case 'ArrowDown': case 's': case 'S':
                    e.preventDefault();
                    this.dirInput(DIR.DOWN);
                    break;
                case 'ArrowLeft': case 'a': case 'A':
                    e.preventDefault();
                    this.dirInput(DIR.LEFT);
                    break;
                case 'ArrowRight': case 'd': case 'D':
                    e.preventDefault();
                    this.dirInput(DIR.RIGHT);
                    break;
                case ' ':
                    e.preventDefault();
                    this.spaceHeld = true;
                    this.game.spaceAction();
                    break;
                case 'Enter':
                    e.preventDefault();
                    this.game.handleConfirm();
                    break;
                case 'r': case 'R':
                    this.game.restartLevel();
                    break;
                case 'p': case 'P':
                    this.game.togglePause();
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === ' ') {
                this.spaceHeld = false;
            }
        });
    }

    // Suuntanäppäin: space pohjassa = etäkaivu, muuten liiku
    dirInput(dir) {
        if (this.spaceHeld) {
            this.game.remoteDig(dir);
        } else {
            this.game.movePlayer(dir);
        }
    }

    setupTouch() {
        // Suuntanäppäimet: space pohjassa = etäkaivu, muuten liiku
        const buttons = document.querySelectorAll('.touch-btn[data-dir]');
        const dirMap = {
            'up': DIR.UP,
            'down': DIR.DOWN,
            'left': DIR.LEFT,
            'right': DIR.RIGHT,
        };
        buttons.forEach(btn => {
            const handler = (e) => {
                if (e.cancelable) e.preventDefault();
                this.dirInput(dirMap[btn.dataset.dir]);
            };
            btn.addEventListener('touchstart', handler, { passive: false });
            // Estetään myös touchendin aiheuttamat klikkaukset iOS:lla
            btn.addEventListener('touchend', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
            btn.addEventListener('mousedown', handler);
        });

        // Ympyränappi imitoi välilyöntiä: pohjassa = etäkaivu-tila
        const spaceBtn = document.getElementById('space-btn');
        if (spaceBtn) {
            const press = (e) => {
                e.preventDefault();
                this.spaceHeld = true;
                spaceBtn.classList.add('active');
            };
            const release = (e) => {
                e.preventDefault();
                this.spaceHeld = false;
                spaceBtn.classList.remove('active');
            };
            spaceBtn.addEventListener('touchstart', press, { passive: false });
            spaceBtn.addEventListener('mousedown', press);
            spaceBtn.addEventListener('touchend', release);
            spaceBtn.addEventListener('touchcancel', release);
            spaceBtn.addEventListener('mouseup', release);
            spaceBtn.addEventListener('mouseleave', release);
        }
    }
}

// audio.js - Prosedyraaliset ääniefektit (Web Audio API)
const AudioFX = (() => {
    let ctx = null;

    function init() {
        if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (ctx.state === 'suspended') ctx.resume();
    }

    // Herätä äänikonteksti ensimmäisestä käyttäjän toiminnosta
    // iOS Safari vaatii usein sekä touchstartin että touchendin varmuuden vuoksi
    document.addEventListener('touchstart', init, { once: true, passive: true });
    document.addEventListener('touchend', init, { once: true, passive: true });
    document.addEventListener('mousedown', init, { once: true });
    document.addEventListener('keydown', init, { once: true });

    // Kevyt rapina liikkuessa
    function playMove() {
        try {
            init();
            const now = ctx.currentTime;
            const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.08), ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.015));
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 2000;
            filter.Q.value = 0.5;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.10, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            src.connect(filter).connect(gain).connect(ctx.destination);
            src.start(now);
            src.stop(now + 0.08);
        } catch(e) {}
    }

    // Napsaus timantin keräämisessä
    function playDiamond() {
        try {
            init();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.13, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
        } catch(e) {}
    }

    // Kevyt räjähdys kuolemassa
    function playExplosion() {
        try {
            init();
            const now = ctx.currentTime;
            const dur = 6.0;
            const peak = 2.5;

            // Kerros 1: Jyrisevä kohina — lähtee hiljaa, nousee ja vaimenee
            const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                data[i] = (Math.random() * 2 - 1);
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const lpFilter = ctx.createBiquadFilter();
            lpFilter.type = 'lowpass';
            lpFilter.frequency.setValueAtTime(300, now);
            lpFilter.frequency.exponentialRampToValueAtTime(40, now + dur);
            const lpGain = ctx.createGain();
            lpGain.gain.setValueAtTime(0.08, now);
            lpGain.gain.linearRampToValueAtTime(0.30, now + peak);
            lpGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
            src.connect(lpFilter).connect(lpGain).connect(ctx.destination);
            src.start(now);
            src.stop(now + dur);

            // Kerros 2: Matala bassojyrinä — nousee ja vaimenee
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(60, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + dur);
            const oscGain = ctx.createGain();
            oscGain.gain.setValueAtTime(0.10, now);
            oscGain.gain.linearRampToValueAtTime(0.35, now + peak);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
            osc.connect(oscGain).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + dur);

            // Kerros 3: Terävä aloitusräsähdys
            const crackDur = 0.08;
            const crackBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * crackDur), ctx.sampleRate);
            const crackData = crackBuf.getChannelData(0);
            for (let i = 0; i < crackData.length; i++) {
                crackData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.006));
            }
            const crackSrc = ctx.createBufferSource();
            crackSrc.buffer = crackBuf;
            const hpFilter = ctx.createBiquadFilter();
            hpFilter.type = 'highpass';
            hpFilter.frequency.value = 1500;
            const crackGain = ctx.createGain();
            crackGain.gain.setValueAtTime(0.15, now);
            crackGain.gain.exponentialRampToValueAtTime(0.001, now + crackDur);
            crackSrc.connect(hpFilter).connect(crackGain).connect(ctx.destination);
            crackSrc.start(now);
            crackSrc.stop(now + crackDur);
        } catch(e) {}
    }

    // Lyhyt räjähdys vihollisen murskaamisessa
    function playCrush() {
        try {
            init();
            const now = ctx.currentTime;
            const dur = 0.3;
            const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.06));
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 500;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.20, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
            src.connect(filter).connect(gain).connect(ctx.destination);
            src.start(now);
            src.stop(now + dur);
        } catch(e) {}
    }

    return { playMove, playDiamond, playExplosion, playCrush };
})();

// game.js - Pelin pääohjain, osa 1

class Game {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.renderer = new Renderer(this.canvas, this);
        this.physics = new Physics(this);
        this.enemyAI = new EnemyAI(this);
        this.input = new InputHandler(this);

        this.grid = [];
        this.cols = 20;
        this.rows = 15;
        this.player = { x: 0, y: 0, facing: DIR.RIGHT };
        this.level = 0;
        this.diamondsCollected = 0;
        this.diamondsNeeded = 10;
        this.keyCollected = false;
        this.score = 0;
        this.lives = INITIAL_LIVES;
        this.paused = false;
        this.gameOver = false;
        this.animFrameId = null;
        this.lastFrameTime = 0;
        this.lastEnemyMove = 0;
        this.levelComplete = false;

        this.overlay = document.getElementById('overlay');
        this.overlayTitle = document.getElementById('overlay-title');
        this.overlayMessage = document.getElementById('overlay-message');
        this.overlayButton = document.getElementById('overlay-button');

        // iOS:ää varten on kuunneltava myös touchstart-tapahtumaa
        const confirmAction = (e) => {
            if (e && e.cancelable) e.preventDefault(); // Estää tuplaklikkaukset (ghost clicks)
            this.handleConfirm();
        };

        this.overlayButton.addEventListener('click', confirmAction);
        this.overlayButton.addEventListener('touchstart', confirmAction, { passive: false });

        // Tausta-ajon hallinta: välilehti taustalle -> tauko
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && !this.paused && !this.gameOver && !this.levelComplete && this.timerEnd > 0) {
                this.togglePause();
            }
        });

        this.startGame();
    }

    startGame(skipIntro) {
        // Debug-tila: URL-parametri ?debug ohittaa intron ja aloittaa suoraan
        const urlParams = new URLSearchParams(window.location.search);
        const isDebug = urlParams.has('debug');
        
        this.level = 0;
        this.score = 0;
        this.lives = INITIAL_LIVES;
        this.gameOver = false;
        this.levelComplete = false;
        this.timerEnd = 0;
        this.deathEnd = 0;
        this.timeRemaining = 0;
        this.paused = !skipIntro && !isDebug;
        this.hideOverlay();
        this.loadLevel(this.level);
        this.updateHUD();
        this.renderer.resize();
        this.startLoop();

        if (!skipIntro && !isDebug) {
            const lvl = LEVEL_DATA[0];
            this.showOverlay('💎 ' + lvl.name,
                'Taso 1 — Kerää ' + lvl.diamondsNeeded + ' timanttia\nja etsi uloskäynti!\n\n⏱ Aikaa 45 sekuntia',
                'Aloita');
        }
        this.renderer.render();
    }

    loadLevel(index) {
        if (index >= LEVEL_DATA.length) {
            try { window.parent.postMessage('BOULDER_KEY_COLLECTED', '*'); } catch(e) {}
            this.showOverlay('🎉 Onnittelut!',
                'Läpäisit kaikki tasot! Lopulliset pisteet: ' + this.score,
                'Pelaa uudelleen');
            this.gameOver = true;
            this.stopLoop();
            return;
        }

        const data = parseLevel(LEVEL_DATA[index]);
        this.grid = data.grid;
        this.cols = data.width;
        this.rows = data.height;
        this.player.x = data.playerStartX;
        this.player.y = data.playerStartY;
        this.player.facing = DIR.RIGHT;
        this.diamondsCollected = 0;
        this.keyCollected = false;
        this.levelComplete = false;

        // Turvatoimi: tarvittavat timantit eivät voi ylittää kentän timantteja
        let totalDiamonds = 0;
        for (let y = 0; y < this.rows; y++) {
            for (let x = 0; x < this.cols; x++) {
                if (this.grid[y][x] === TILE.DIAMOND) totalDiamonds++;
            }
        }
        this.diamondsNeeded = Math.min(data.diamondsNeeded, totalDiamonds);

        this.physics.reset();
        this.enemyAI.scanEnemies();
        this.lastEnemyMove = performance.now();

        document.getElementById('level-display').textContent =
            'Taso: ' + (index + 1) + ' - ' + data.name;

        this.renderer.resize();
        this.updateHUD();
        this.timerEnd = 0;
    }

    movePlayer(dir) {
        if (this.paused || this.gameOver || this.levelComplete || this.deathEnd > 0) return;
        const oldX = this.player.x, oldY = this.player.y;

        this.player.facing = dir;

        const nx = this.player.x + dir.dx;
        const ny = this.player.y + dir.dy;

        if (nx < 0 || nx >= this.cols || ny < 0 || ny >= this.rows) {
            this.applyGravity();
            this.lastFrameTime = performance.now();
            this.updateHUD();
            this.renderer.render();
            return;
        }

        const targetTile = this.grid[ny][nx];

        switch (targetTile) {
            case TILE.EMPTY:
                this.player.x = nx; this.player.y = ny;
                break;
            case TILE.DIRT:
                this.grid[ny][nx] = TILE.EMPTY;
                this.player.x = nx; this.player.y = ny;
                break;
            case TILE.DIAMOND:
                this.grid[ny][nx] = TILE.EMPTY;
                this.player.x = nx; this.player.y = ny;
                this.collectDiamond();
                break;
            case TILE.KEY:
                this.grid[ny][nx] = TILE.EMPTY;
                this.player.x = nx; this.player.y = ny;
                this.collectKey();
                break;
            case TILE.BOULDER: {
                const bx = nx + dir.dx;
                const by = ny + dir.dy;
                if (bx >= 0 && bx < this.cols && by >= 0 && by < this.rows &&
                    this.grid[by][bx] === TILE.EMPTY) {
                    this.grid[by][bx] = TILE.BOULDER;
                    this.grid[ny][nx] = TILE.EMPTY;
                    this.player.x = nx; this.player.y = ny;
                }
                break;
            }
            case TILE.EXIT:
                if (this.diamondsCollected >= this.diamondsNeeded && this.keyCollected) {
                    this.completeLevel(); return;
                }
                break;
            case TILE.FIREFLY:
            case TILE.BUTTERFLY:
                this.killPlayer(); return;
            case TILE.WALL:
                break;
        }

        if (this.player.x !== oldX || this.player.y !== oldY) AudioFX.playMove();
        this.applyGravity();
        this.lastFrameTime = performance.now();
        this.updateHUD();
        this.renderer.render();
    }
// Syö yksi multapala/timantti "etänä" annettuun suuntaan (ei liiku)
    remoteDig(dir) {
        if (this.deathEnd > 0) return;
        const d = dir || this.player.facing;
        this.player.facing = d;
        const nx = this.player.x + d.dx;
        const ny = this.player.y + d.dy;
        if (nx >= 0 && nx < this.cols && ny >= 0 && ny < this.rows) {
            const tile = this.grid[ny][nx];
            if (tile === TILE.DIRT) {
                this.grid[ny][nx] = TILE.EMPTY;
            } else if (tile === TILE.DIAMOND) {
                this.grid[ny][nx] = TILE.EMPTY;
                this.collectDiamond();
            } else {
                return;
            }
            this.applyGravity();
            this.lastFrameTime = performance.now();
            this.updateHUD();
            this.renderer.render();
        }
    }

    // Välilyönti: pelin tilan siirtymät (kaivu tapahtuu space+suunta)
    spaceAction() {
        if (this.gameOver) {
            this.startGame(true);
        } else if (this.levelComplete) {
            this.nextLevel();
        } else if (this.paused) {
            this.togglePause();
        }
    }

    // Enter / overlay-nappi: jatka tilan mukaan
    handleConfirm() {
        if (this.gameOver) {
            this.startGame(true);
        } else if (this.levelComplete) {
            this.nextLevel();
        } else if (this.paused) {
            this.togglePause();
        }
    }

    collectDiamond() {
        this.diamondsCollected++;
        this.score += SCORE_DIAMOND;
        AudioFX.playDiamond();
    }

    collectKey() {
        this.keyCollected = true;
        this.score += SCORE_KEY;
        AudioFX.playDiamond();
        try { window.parent.postMessage('BOULDER_KEY_COLLECTED', '*'); } catch(e) {}
    }

    applyGravity() {
        this.physics.updateAll();
    }

    killPlayer() {
        if (this.deathEnd > 0) return; // jo kuolemassa
        AudioFX.playExplosion();
        this.renderer.addDeathExplosion(this.player.x, this.player.y);
        this.timerEnd = 0;
        this.deathEnd = performance.now() + 6000;
        this.renderer.render();
    }

    finalizeKill() {
        this.lives--;
        this.updateHUD();
        if (this.lives <= 0) {
            this.showOverlay('💀 Kuolit!',
                'Elämät loppuivat! Pisteet: ' + this.score,
                'Pelaa uudelleen');
            this.gameOver = true;
            this.stopLoop();
        } else {
            this.loadLevel(this.level);
        }
        this.renderer.render();
    }

    completeLevel() {
        this.score += SCORE_LEVEL_BONUS;
        this.levelComplete = true;
        this.showOverlay('✅ Taso läpäisty!',
            'Keräsit ' + this.diamondsCollected + ' / ' + this.diamondsNeeded + ' timanttia\nBonus: +' + SCORE_LEVEL_BONUS,
            'Seuraava taso');
        this.updateHUD();
        this.renderer.render();
    }

    nextLevel() {
        this.level++;
        this.levelComplete = false;
        this.paused = false;
        this.hideOverlay();
        this.loadLevel(this.level);
        this.updateHUD();
        this.renderer.resize();
        this.renderer.render();
    }

    restartLevel() {
        this.loadLevel(this.level);
        this.updateHUD();
        this.renderer.render();
    }

    togglePause() {
        if (this.gameOver) return;
        this.paused = !this.paused;
        if (this.paused) {
            this.timeRemaining = this.timerEnd > 0 ? this.timerEnd - performance.now() : 0;
            this.showOverlay('⏸️ Tauko', 'Paina P tai Enter jatkaaksesi', 'Jatka');
        } else {
            if (this.timerEnd > 0 && this.timeRemaining > 0) {
                this.timerEnd = performance.now() + this.timeRemaining;
            }
            this.hideOverlay();
        }
    }

    spawnExplosion(x, y) {
        this.renderer.addExplosion(x, y);
    }

    updateHUD() {
        document.getElementById('diamond-display').textContent =
            '💎 ' + this.diamondsCollected;
        document.getElementById('diamond-goal-display').textContent =
            'Tavoite: ' + this.diamondsNeeded;
        // Avaimen tila
        const keyEl = document.getElementById('key-display');
        if (keyEl) {
            keyEl.textContent = this.keyCollected ? '🔑 ✓' : '🔑 ✗';
            keyEl.style.color = this.keyCollected ? '#ffd700' : '#ff4444';
        }
        document.getElementById('score-display').textContent =
            'Pisteet: ' + this.score;
        document.getElementById('lives-display').textContent =
            '❤️ ' + this.lives;
        // Ajastin
        const timerEl = document.getElementById('timer-display');
        if (timerEl && this.timerEnd > 0 && !this.paused && !this.levelComplete && !this.gameOver) {
            const s = Math.max(0, Math.ceil((this.timerEnd - performance.now()) / 1000));
            timerEl.textContent = '⏱ ' + s;
            timerEl.style.color = s <= 10 ? '#ff4444' : '';
        }
    }

    showOverlay(title, message, buttonText) {
        this.overlayTitle.textContent = title;
        this.overlayMessage.textContent = message;
        this.overlayButton.textContent = buttonText;
        this.overlay.classList.remove('hidden');
    }

    hideOverlay() {
        this.overlay.classList.add('hidden');
    }

    startLoop() {
        this.stopLoop();
        this.lastFrameTime = performance.now();
        this.lastEnemyMove = performance.now();
        this.loop(this.lastFrameTime);
    }

    stopLoop() {
        if (this.animFrameId) {
            cancelAnimationFrame(this.animFrameId);
            this.animFrameId = null;
        }
    }

    loop(timestamp) {
        if (this.gameOver) return;
        this.animFrameId = requestAnimationFrame((t) => this.loop(t));
        this.renderer.updateAnimations();

        // Kuoleman viive: näytä räjähdys 3s, sitten suorita kuolema
        if (this.deathEnd > 0) {
            if (timestamp >= this.deathEnd) {
                this.deathEnd = 0;
                this.finalizeKill();
            } else {
                this.renderer.render();
                return;
            }
        }

        if (!this.paused && !this.levelComplete) {
            // Aloita ajastin tarvittaessa (45 s)
            if (this.timerEnd === 0) {
                this.timerEnd = performance.now() + 45 * 1000;
            }
            // Ajastin: jos aika loppuu, pelaaja kuolee
            if (timestamp >= this.timerEnd) {
                this.timerEnd = 0;
                this.killPlayer();
                return;
            }
            // Painovoima joka kehyksellä
            if (timestamp - this.lastFrameTime >= FRAME_DELAY) {
                this.lastFrameTime = timestamp;
                this.applyGravity();
                this.updateHUD();
            }
            // Viholliset liikkuvat hitaammin -> pelaaja ehtii karkuun
            if (timestamp - this.lastEnemyMove >= ENEMY_DELAY) {
                this.lastEnemyMove = timestamp;
                this.enemyAI.updateAll();
                this.updateHUD();
            }
        }
        this.renderer.render();
    }
}

window.addEventListener('DOMContentLoaded', () => {
    new Game();
});
</script>
